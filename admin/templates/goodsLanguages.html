{% extends "page.html" %}
{% block title %}商品语言{% endblock %}
{% block body %}
<div class="page-pad">
    <div class="muted" style="margin-bottom:8px">商品内容（分类、属性、商品、规格）的语言，与后台界面语言无关。默认语言的内容就是各表单里直接填写的文字，其他语言通过各列表的「翻译」按钮录入，缺译时回退到默认语言。</div>
    <div id="langGrid"></div>
</div>
<script src="/static/js/lib/shop.js"></script>
<script>
$(function () {
    var grid = new DxGrid($('#langGrid')[0], {
        dataSource: DxGrid.restStore('/api/v1/shop/languages', 'id'),
        keyExpr: 'id',
        searchPanel: { visible: false }, filterRow: { visible: false }, headerFilter: { visible: false },
        paging: { enabled: false }, pager: { visible: false }, height: 'auto', autoHeight: false, dxFeatures: false,
        editing: {
            mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
            texts: {
                addRow: '新增语言', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteTitle: '删除语言',
                confirmDeleteMessage: '确定删除该语言吗？该语言下所有商品内容的译文会一并删除，不可恢复；默认语言不能删除'
            },
            popup: { title: '商品语言', width: 460, height: 'auto', showTitle: true },
            form: { colCount: 1, labelLocation: 'left', items: ['code', 'name', 'is_default', 'sort_order', 'status'] }
        },
        onInitNewRow: function (e) { e.data.is_default = false; e.data.sort_order = 0; e.data.status = true; },
        onRowDblClick: function (e) { if (e.rowType === 'data') { e.component.editRow(e.rowIndex); } },
        onEditorPreparing: function (e) {
            if (e.parentType === 'dataRow' && e.dataField === 'code' && !e.row.isNewRow) { e.editorOptions.readOnly = true; }
            if (e.parentType === 'dataRow' && e.dataField === 'code' && e.row.isNewRow) { e.editorOptions.placeholder = '如 en、ja、fr、zh-TW'; }
            if (e.parentType === 'dataRow' && e.dataField === 'is_default' && !e.row.isNewRow && e.row.data.is_default) { e.editorOptions.readOnly = true; }
        },
        onToolbarPreparing: function (e) {
            e.toolbarOptions.items.forEach(function (item) {
                if (item.name === 'addRowButton') {
                    item.showText = 'always'; item.location = 'before';
                    item.options = $.extend(item.options, { type: 'default', stylingMode: 'contained' });
                }
            });
        },
        onRowInserted: function () { DevExpress.ui.notify('语言已新增', 'success', 1800); },
        onRowUpdated: function (e) { DevExpress.ui.notify('语言已保存', 'success', 1800); e.component.refresh(); },
        onRowRemoved: function () { DevExpress.ui.notify('语言已删除', 'success', 1800); },
        columns: [
            { dataField: 'code', caption: '语言代码', width: 140, validationRules: [{ type: 'required', message: '请输入语言代码' }] },
            { dataField: 'name', caption: '语言名称', validationRules: [{ type: 'required', message: '请输入语言名称' }] },
            { dataField: 'is_default', caption: '默认语言', dataType: 'boolean', width: 100 },
            { dataField: 'sort_order', caption: '排序', dataType: 'number', width: 80 },
            { dataField: 'status', caption: '启用', dataType: 'boolean', width: 80 }
        ]
    });
});
</script>
{% endblock %}
