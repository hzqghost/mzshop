{% extends "page.html" %}
{% block title %}Grid 配置{% endblock %}
{% block body %}
<div class="cfg-page">
    <div class="cfg-card">
        <div class="cfg-title">方案</div>
        <div class="cfg-tip">选一个常用方案作为起点，再按需微调；调整任何一项后方案显示为「自定义」</div>
        <div id="gsPresets" class="cfg-presets"></div>
    </div>

    <div class="cfg-card">
        <div class="cfg-title">样式</div>
        <div id="gsForm"></div>
    </div>

    <div class="cfg-card">
        <div class="cfg-title">预览</div>
        <div class="cfg-tip">保存后，已打开的页面刷新才会生效，新打开的页面立即生效；设置只对当前登录用户有效</div>
        <div class="gs-preview"><div id="gsPreviewGrid"></div></div>
    </div>

    <div id="gsActions" class="cfg-actions"></div>
</div>

<script>
$(function () {
    var presets = {{ presets|tojson }};
    var style = {{ style|tojson }};
    var PRESET_NAMES = {
        'default': ['默认', '浅灰表头、横竖线都有、斑马纹、行距紧凑、页码按钮'],
        'classic': ['经典蓝头', '浅蓝表头、横竖线都有、页码按钮'],
        'dark': ['深色表头', '深蓝底白字表头，隔行浅底'],
        'stripe': ['斑马纹', '浅灰表头，隔行浅底，便于横向对行'],
        'compact': ['紧凑', '行距小、横竖线，每页 50 条，一屏看更多'],
        'large': ['大字号', '表格字号 14px，行距标准，阅读更轻松']
    };

    var FIELDS = ['headerBg', 'headerFg', 'columnLines', 'rowLines', 'stripe', 'density', 'pagerMode', 'pageSize', 'pagerInfo',
        'hoverRow', 'hoverBg', 'selectBg', 'stripeBg', 'fontSize', 'headerWeight', 'headerHeight', 'align', 'filterRow',
        'textOverflow', 'fixedCommand', 'autoWidth', 'showBorders', 'radius'];
    var COLOR_FIELDS = ['headerBg', 'headerFg', 'hoverBg', 'selectBg', 'stripeBg'];
    var PAD = { compact: '4px', normal: '8px', loose: '12px' };
    var RADIUS = { none: '0', small: '4px', large: '8px' };
    var CLASSES = ['gs-select', 'gs-font', 'gs-align-left'];
    var VARS = ['--gs-header-bg', '--gs-header-fg', '--gs-pad-y', '--gs-hover-bg', '--gs-select-bg', '--gs-stripe-bg',
        '--gs-font-size', '--gs-header-weight', '--gs-head-pad-y', '--gs-radius'];

    // 配置页自己不吃已保存的样式：清掉 body 上的 gs 变量和 class，预览容器按表单值重新设，改了表单立刻看到效果
    CLASSES.concat(['gs-stripe']).forEach(function (c) { document.body.classList.remove(c); });
    VARS.forEach(function (v) { document.body.style.removeProperty(v); });
    var form, preview, applying = false;

    function formValues() {
        var data = form.option('formData');
        var values = {};
        FIELDS.forEach(function (k) { values[k] = data[k]; });
        COLOR_FIELDS.forEach(function (k) { values[k] = values[k] || ''; });
        values.preset = currentPreset(values);
        return values;
    }

    // 与哪个预设完全一致就算哪个，否则是自定义
    function currentPreset(values) {
        var found = 'custom';
        Object.keys(presets).forEach(function (key) {
            if (FIELDS.every(function (k) { return presets[key][k] === values[k]; })) { found = key; }
        });
        return found;
    }

    function renderPresets() {
        var active = currentPreset(formValues());
        var $box = $('#gsPresets').empty();
        Object.keys(PRESET_NAMES).forEach(function (key) {
            $('<div class="cfg-preset">').toggleClass('active', key === active)
                .append($('<div class="cfg-preset-name">').text(PRESET_NAMES[key][0]))
                .append($('<div class="cfg-preset-tip">').text(PRESET_NAMES[key][1]))
                .on('click', function () { applyValues(presets[key]); })
                .appendTo($box);
        });
        $('<div class="cfg-preset cfg-preset-custom">').toggleClass('active', active === 'custom')
            .append($('<div class="cfg-preset-name">').text('自定义'))
            .appendTo($box);
    }

    // 与后端 ui_style.grid_body_attrs() 同一套规则：只写与默认不同的项，没设的变量走 css 里的后备值
    function refreshPreview() {
        var v = formValues();
        var $p = $('.gs-preview');
        var setVar = function (name, value) {
            if (value) { $p[0].style.setProperty(name, value); } else { $p[0].style.removeProperty(name); }
        };
        setVar('--gs-header-bg', v.headerBg);
        setVar('--gs-header-fg', v.headerFg);
        setVar('--gs-pad-y', PAD[v.density]);
        setVar('--gs-hover-bg', v.hoverBg);
        setVar('--gs-select-bg', v.selectBg);
        setVar('--gs-stripe-bg', v.stripeBg);
        setVar('--gs-font-size', v.fontSize !== 13 ? v.fontSize + 'px' : '');
        setVar('--gs-header-weight', v.headerWeight === 'normal' ? '400' : '');
        setVar('--gs-head-pad-y', v.headerHeight !== 'auto' ? PAD[v.headerHeight] : '');
        setVar('--gs-radius', v.radius !== 'small' ? RADIUS[v.radius] : '');
        $p.toggleClass('gs-select', !!v.selectBg).toggleClass('gs-font', v.fontSize !== 13).toggleClass('gs-align-left', v.align === 'left');
        var options = DxGrid.styleOptions(v);
        options.paging = { pageSize: Math.min(v.pageSize, 5) };
        preview.option(options);
        renderPresets();
    }

    function applyValues(values) {
        applying = true;
        form.option('formData', $.extend({}, values));
        applying = false;
        refreshPreview();
    }

    var rows = [];
    for (var i = 1; i <= 12; i++) {
        rows.push({ name: '名称 ' + i, brand: 'Brand ' + (i % 4 + 1), code: 'A' + (1000 + i * 7), qty: i * 13, status: i % 3 ? '启用' : '停用' });
    }
    preview = new DxGrid($('#gsPreviewGrid')[0], $.extend({
        dataSource: rows,
        autoHeight: false,
        height: 'auto',
        searchPanel: { visible: false },
        headerFilter: { visible: false },
        dxFeatures: false,
        selection: { mode: 'single' },
        pager: { visible: true, showPageSizeSelector: true, allowedPageSizes: [5, 10], showNavigationButtons: true },
        columns: [
            { dataField: 'name', caption: '名称' },
            { dataField: 'brand', caption: '品牌' },
            { dataField: 'code', caption: '编码' },
            { dataField: 'qty', caption: '数量', dataType: 'number' },
            { dataField: 'status', caption: '状态' }
        ]
    }, {}));

    var colorOpts = { applyValueMode: 'instantly', placeholder: '跟随主题', showClearButton: true };
    function select(items) { return { editorType: 'dxSelectBox', editorOptions: { valueExpr: 'v', displayExpr: 't', items: items } }; }
    function sw(key, text) { return { dataField: key, label: { text: text }, editorType: 'dxSwitch' }; }
    function color(key, text) { return { dataField: key, label: { text: text }, editorType: 'dxColorBox', editorOptions: colorOpts }; }
    var grades = [{ v: 'compact', t: '紧凑' }, { v: 'normal', t: '标准' }, { v: 'loose', t: '宽松' }];

    form = $('#gsForm').dxForm({
        formData: $.extend({}, style),
        labelLocation: 'left',
        colCount: 2,
        onFieldDataChanged: function () { if (!applying && preview) { refreshPreview(); } },
        items: [
            color('headerBg', '表头背景色'),
            color('headerFg', '表头文字色'),
            sw('columnLines', '显示竖线'),
            sw('rowLines', '显示横线'),
            sw('stripe', '斑马纹'),
            sw('pagerInfo', '显示分页信息'),
            $.extend({ dataField: 'density', label: { text: '行高' } }, select(grades)),
            $.extend({ dataField: 'pagerMode', label: { text: '分页样式' } }, select([{ v: 'compact', t: '紧凑（页码输入框）' }, { v: 'full', t: '完整（页码按钮）' }])),
            { dataField: 'pageSize', label: { text: '默认每页条数' }, editorType: 'dxSelectBox', editorOptions: { items: [10, 20, 50, 100, 500] } },
            sw('hoverRow', '悬停行高亮'),
            color('hoverBg', '悬停行底色'),
            color('selectBg', '选中行底色'),
            color('stripeBg', '斑马纹底色'),
            { dataField: 'fontSize', label: { text: '表格字号' }, editorType: 'dxSelectBox', editorOptions: { items: [12, 13, 14] } },
            $.extend({ dataField: 'headerWeight', label: { text: '表头字重' } }, select([{ v: 'bold', t: '加粗' }, { v: 'normal', t: '正常' }])),
            $.extend({ dataField: 'headerHeight', label: { text: '表头高度' } }, select([{ v: 'auto', t: '跟随行高' }].concat(grades))),
            $.extend({ dataField: 'align', label: { text: '文字对齐' } }, select([{ v: 'default', t: '默认（数字靠右）' }, { v: 'left', t: '全部靠左' }])),
            $.extend({ dataField: 'textOverflow', label: { text: '文字过长' } }, select([{ v: 'ellipsis', t: '省略号' }, { v: 'wrap', t: '换行显示' }])),
            $.extend({ dataField: 'radius', label: { text: '外框圆角' } }, select([{ v: 'none', t: '无' }, { v: 'small', t: '小' }, { v: 'large', t: '大' }])),
            sw('filterRow', '显示筛选行'),
            sw('showBorders', '显示表格外框'),
            sw('autoWidth', '列宽按内容自适应'),
            sw('fixedCommand', '冻结勾选列和操作列')
        ]
    }).dxForm('instance');
    refreshPreview();

    $('<div>').appendTo('#gsActions').dxButton({
        text: '保存', type: 'default', icon: 'save',
        onClick: function () {
            apiPost('/api/v1/ui-style/grid/save', { values: formValues() }).then(function () {
                DevExpress.ui.notify('已保存', 'success', 2000);
            }, apiError);
        }
    });
    $('<div>').appendTo('#gsActions').dxButton({
        text: '恢复默认', icon: 'revert',
        onClick: function () {
            DevExpress.ui.dialog.confirm('确定恢复为默认方案吗？你保存的表格样式会被清除', '恢复默认').then(function (ok) {
                if (!ok) { return; }
                apiPost('/api/v1/ui-style/grid/reset').then(function (def) {
                    applyValues(def);
                    DevExpress.ui.notify('已恢复默认方案', 'success', 2000);
                }, apiError);
            });
        }
    });
});
</script>
{% endblock %}
