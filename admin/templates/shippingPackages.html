{% extends "page.html" %}
{% block title %}包装管理{% endblock %}
{% block body %}
<div class="page-pad">
    <div class="package-note">商品只选择包装组；采购更换箱子时，只需修改包装组的“当前包装箱”。尺寸单位统一为厘米，保留两位小数。</div>
    <div id="packageTabs"></div>
</div>
<script>
function boxStore() { return DxGrid.restStore('/api/v1/shipping-packages/boxes', 'id'); }
function groupStore() { return DxGrid.restStore('/api/v1/shipping-packages/groups', 'id'); }
function boxLookup() {
    return new DevExpress.data.CustomStore({ key: 'id', loadMode: 'raw',
        load: function () { return $.ajax({url: APP.HOST + '/api/v1/shipping-packages/boxes'}).then(function(r){ return (r.data || []).filter(function(x){return x.status;}); }); },
        byKey: function (id) { return $.ajax({url: APP.HOST + '/api/v1/shipping-packages/boxes'}).then(function(r){ return (r.data || []).filter(function(x){return x.id === id;})[0] || null; }); }
    });
}
function uploadGroupImage(file) {
    var fd = new FormData(); fd.append('file', file);
    return $.ajax({url:APP.HOST + '/api/v1/shop/upload', method:'POST', data:fd,
        processData:false, contentType:false}).then(function(r){
        if (!r || r.code !== 0) { return $.Deferred().reject((r && r.msg) || '上传失败').promise(); }
        return r.data.url;
    });
}
function groupImagesTemplate(d, el) {
    var $root = $('<div class="group-images"></div>').appendTo(el);
    function images() { return (d.component.option('formData').images || []).slice(); }
    function paint() {
        $root.empty();
        var $bar = $('<div class="group-image-bar"></div>').appendTo($root);
        var $input = $('<input type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none">').appendTo($bar);
        $('<button type="button" class="group-image-upload">选择图片（最多20张）</button>').on('click', function(){ $input.trigger('click'); }).appendTo($bar);
        $('<span class="muted"></span>').text(' 已上传 ' + images().length + ' 张').appendTo($bar);
        var $list = $('<div class="group-image-list"></div>').appendTo($root);
        images().forEach(function(image, index){
            var $card = $('<div class="group-image-card"></div>').appendTo($list);
            $('<a target="_blank" rel="noopener"></a>').attr('href', image.url).append($('<img alt="包装组图片">').attr('src', image.url)).appendTo($card);
            $('<button type="button" title="移除">×</button>').on('click', function(){
                var next = images(); next.splice(index, 1); d.component.updateData('images', next); paint();
            }).appendTo($card);
        });
        $input.on('change', function(){
            var files = Array.from(this.files || []), current = images();
            if (current.length + files.length > 20) { DevExpress.ui.notify('一个包装组最多 20 张图片', 'error', 2500); return; }
            var chain = $.Deferred().resolve().promise();
            files.forEach(function(file){ chain = chain.then(function(){ return uploadGroupImage(file).then(function(url){ current.push({url:url,sort_order:current.length}); }); }); });
            chain.then(function(){ d.component.updateData('images', current); paint(); DevExpress.ui.notify('图片上传成功，请保存包装组', 'success', 1800); }, apiError);
        });
    }
    paint();
}
function dimensionColumn(field, caption) {
    return {dataField: field, caption: caption, dataType: 'number', minWidth: 115,
        format: {type:'fixedPoint', precision:2}, editorOptions: {min:0.01, format:'#0.00'},
        validationRules: [{type:'required', message:'请填写' + caption}, {type:'range', min:0.01, message:caption + '必须大于 0'}]};
}
function renderBoxes(el) {
    new DxGrid(el, {dataSource: boxStore(), keyExpr:'id', businessToolbar:true,
        editing:{mode:'popup', allowAdding:true, allowUpdating:true, allowDeleting:true, useIcons:true,
            texts:{addRow:'新增包装箱', confirmDeleteMessage:'确定删除该包装箱吗？'},
            popup:{title:'包装箱', width:'90%', maxWidth:760, height:'auto', showTitle:true},
            form:{colCount:2, labelLocation:'left', items:[
                {dataField:'name', colSpan:2}, {dataField:'length_cm'}, {dataField:'width_cm'}, {dataField:'height_cm'},
                {dataField:'empty_weight_g'}, {dataField:'status'}, {dataField:'remark', colSpan:2, editorType:'dxTextArea'}
            ]}},
        onInitNewRow:function(e){e.data.status=true;e.data.empty_weight_g=0;},
        columns:[
            {dataField:'name', caption:'箱型名称', minWidth:150, validationRules:[{type:'required',message:'请填写箱型名称'}]},
            dimensionColumn('length_cm','外部长(cm)'), dimensionColumn('width_cm','外部宽(cm)'), dimensionColumn('height_cm','外部高(cm)'),
            {dataField:'empty_weight_g', caption:'空箱重量(g)', dataType:'number', minWidth:120, editorOptions:{min:0}, validationRules:[{type:'range',min:0,message:'不能小于 0'}]},
            {dataField:'group_count', caption:'使用包装组', dataType:'number', width:100, allowEditing:false, formItem:{visible:false}},
            {dataField:'status', caption:'启用', dataType:'boolean', width:75}, {dataField:'remark', caption:'备注', minWidth:180},
            {dataField:'id', caption:'ID', width:70, allowEditing:false, formItem:{visible:false}}
        ]});
}
function renderGroups(el) {
    new DxGrid(el, {dataSource: groupStore(), keyExpr:'id', businessToolbar:true,
        editing:{mode:'popup', allowAdding:true, allowUpdating:true, allowDeleting:true, useIcons:true,
            texts:{addRow:'新增包装组', confirmDeleteMessage:'确定删除该包装组吗？'},
            popup:{title:'包装组', width:'90%', maxWidth:680, height:'auto', showTitle:true},
            form:{colCount:1, labelLocation:'left', items:['name','current_box_id','status',{dataField:'remark',editorType:'dxTextArea'},
                {dataField:'images', label:{text:'图片'}, template:groupImagesTemplate}]}},
        onInitNewRow:function(e){e.data.status=true;e.data.images=[];},
        columns:[
            {dataField:'name', caption:'包装组名称', minWidth:170, validationRules:[{type:'required',message:'请填写包装组名称'}]},
            {dataField:'current_box_id', caption:'当前包装箱', minWidth:180,
                lookup:{dataSource:boxLookup(),valueExpr:'id',displayExpr:'name'},
                editorOptions:{noDataText:'没有启用的包装箱，请先到“包装箱”页签新增并启用'},
                validationRules:[{type:'required',message:'请选择当前包装箱'}]},
            {dataField:'images', caption:'图片', width:90, allowEditing:false, allowFiltering:false, allowSorting:false, formItem:{visible:true},
                calculateCellValue:function(row){return (row.images || []).length;},
                cellTemplate:function(el,o){var list=o.data.images||[]; if(!list.length){$('<span class="muted">0 张</span>').appendTo(el);return;} $('<img class="group-image-thumb">').attr('src',list[0].url).appendTo(el); $('<span></span>').text(' '+list.length+' 张').appendTo(el);}},
            {dataField:'usage_count', caption:'商品/SKU/店铺引用', dataType:'number', width:150, allowEditing:false, formItem:{visible:false}},
            {dataField:'status', caption:'启用', dataType:'boolean', width:75}, {dataField:'remark', caption:'备注', minWidth:200},
            {dataField:'id', caption:'ID', width:70, allowEditing:false, formItem:{visible:false}}
        ]});
}
$(function(){
    $('#packageTabs').dxTabPanel({deferRendering:false, items:[
        {title:'包装组', template:function(_, __, el){var host=$('<div></div>').appendTo(el)[0];renderGroups(host);}},
        {title:'包装箱', template:function(_, __, el){var host=$('<div></div>').appendTo(el)[0];renderBoxes(host);}}
    ]});
});
</script>
<style>
.package-note{margin-bottom:10px;padding:9px 12px;border:1px solid #cfe1ef;background:#f4f9fd;color:#40576a;font-size:12px}
#packageTabs .dx-multiview-wrapper{padding-top:10px}
.group-image-bar{margin-bottom:8px}.group-image-upload{padding:6px 12px;border:1px solid #58a7dc;background:#fff;color:#2584c4;border-radius:3px;cursor:pointer}
.group-image-list{display:flex;flex-wrap:wrap;gap:8px}.group-image-card{position:relative;width:92px;height:92px;border:1px solid #d5dde5;background:#fff}
.group-image-card img{width:100%;height:100%;object-fit:contain}.group-image-card button{position:absolute;right:2px;top:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;cursor:pointer}
.group-image-thumb{width:36px;height:36px;object-fit:contain;vertical-align:middle;border:1px solid #d5dde5;background:#fff}
</style>
{% endblock %}
