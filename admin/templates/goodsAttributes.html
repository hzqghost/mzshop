{% extends "page.html" %}
{% block title %}商品属性{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="attrGrid"></div>
</div>
<script src="/static/js/lib/shop.js"></script>
<script>
/*
 * 商品属性的多语言：
 *  - 属性名称：每种语言一列（i18n.<语言>.name）
 *  - 单选 / 多选属性的可选值：在「编辑选项」弹窗表格里逐行维护，默认语言一列 + 每种语言一列，译文按行（序号）与默认值一一对应
 *  - 文本属性在商品里「录入的内容」的译文，在商品编辑页逐个属性填写
 */
$(function () {
    Shop.ready.then(function () {
        var grid;
        var catNames = {};   // 分类 id → 完整路径，列表单元格显示用
        Shop.call('GET', '/categories').then(function (rows) {
            rows.forEach(function (r) { catNames[r.id] = r.full_name; });
            if (grid) { grid.refresh(); }
        });

        // 按录入方式显示对应字段：单选 → 可选值；数字 → 小数位数、单位（含各语言）。只在类型变了才改，避免重绘循环
        var UNIT_ITEMS = ['decimal_places', 'unit', 'unitI18n'];
        function toggleByType(form, t) {
            if (form.__inited && form.__type === t) { return; }
            form.__inited = true;
            form.__type = t;
            form.itemOption('options', 'visible', t === 'select' || t === 'multiselect');
            UNIT_ITEMS.forEach(function (f) { form.itemOption(f, 'visible', t === 'number'); });
        }

        // 弹窗刚打开时表单数据还是空的，录入方式从表格正在编辑的行取（新增行取 changes 里的 insert 数据）
        function editingType() {
            var ch = (grid.option('editing.changes') || [])[0] || {};
            if (ch.data && ch.data.input_type) { return ch.data.input_type; }
            if (ch.type === 'insert') { return 'text'; }
            var row = grid.getVisibleRows().filter(function (r) { return r.isEditing; })[0];
            return row ? row.data.input_type : 'text';
        }

        // 可选值编辑器：表单里只放一个「编辑选项」按钮，点开弹窗表格逐行维护（可新增 / 编辑 / 删除 / 拖动排序）。
        // 行 = {k: 行键, v: 默认语言值, <语言>: 译文}；任何改动都把 options 和各语言的 options 按行顺序同步写回属性行数据
        function optionsEditor(el, o) {
            var ri = o.row.rowIndex;
            var codes = Shop.langs.map(function (l) { return l.code; });
            var rows = (o.value || []).map(function (v, i) {
                var r = { k: i + 1, v: v };
                codes.forEach(function (c) { r[c] = (grid.cellValue(ri, 'i18n.' + c + '.options') || [])[i] || ''; });
                return r;
            });
            var nextKey = rows.length + 1;
            var $sum = $('<span class="opt-sum"></span>');
            $('<div class="opt-bar"></div>').appendTo(el).append($('<div></div>').dxButton({
                text: '编辑选项', icon: 'edit', stylingMode: 'outlined', onClick: openPopup
            })).append($sum);

            function summary() {
                var t = rows.map(function (r) { return r.v; }).join('、');
                $sum.text(rows.length ? '共 ' + rows.length + ' 项：' + (t.length > 20 ? t.slice(0, 20) + '…' : t) : '尚未添加选项');
            }
            summary();

            function commit() {
                o.setValue(rows.map(function (r) { return String(r.v || '').trim(); }));
                codes.forEach(function (c) { grid.cellValue(ri, 'i18n.' + c + '.options', rows.map(function (r) { return String(r[c] || '').trim(); })); });
                summary();
            }

            function openPopup() {
                var $pop = $('<div></div>').appendTo(document.body);
                $pop.dxPopup({
                    title: '选项：' + (grid.cellValue(ri, 'name') || '新属性'), width: function () { return Math.min(760, window.innerWidth * 0.96); }, height: 480, showCloseButton: true,
                    dragEnabled: true, hideOnOutsideClick: false,
                    contentTemplate: function (c) {
                        new DxGrid($('<div></div>').appendTo(c)[0], {
                            gridKey: 'attrOptions', autoHeight: false, height: 400, keyExpr: 'k',
                            dataSource: new DevExpress.data.ArrayStore({ data: rows, key: 'k' }),
                            selection: { mode: 'none' }, filterPanel: { visible: false }, groupPanel: { visible: false },
                            searchPanel: { visible: false }, pager: { visible: false }, paging: { pageSize: 500 },
                            editing: {
                                mode: 'row', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
                                texts: { confirmDeleteMessage: '确定删除该选项吗？' }
                            },
                            // 拖动排序：直接调整 rows 的顺序
                            rowReorder: function (i) {
                                var from = rows.findIndex(function (r) { return r.k === i.key; });
                                var item = rows.splice(from, 1)[0];
                                var to = rows.findIndex(function (r) { return r.k === i.targetKey; });
                                rows.splice(i.after ? to + 1 : to, 0, item);
                                commit();
                            },
                            onInitNewRow: function (e) { e.data.k = nextKey++; e.data.v = ''; codes.forEach(function (c) { e.data[c] = ''; }); },
                            onSaved: function () { commit(); },   // 新增 / 修改 / 删除（含批量编辑保存）后同步
                            columns: [
                                { caption: '序号', width: 60, allowEditing: false, allowFiltering: false, allowSorting: false,
                                  calculateCellValue: function (r) { return rows.findIndex(function (x) { return x.k === r.k; }) + 1; } },
                                {
                                    dataField: 'v', caption: '选项名称（默认语言）',
                                    validationRules: [
                                        { type: 'required', message: '请输入选项名称' },
                                        { type: 'stringLength', max: 100, message: '最长 100 个字符' },
                                        { type: 'custom', message: '选项名称不能重复', validationCallback: function (e) {
                                            var v = String(e.value || '').trim();
                                            return rows.every(function (r) { return r.k === e.data.k || String(r.v || '').trim() !== v; });
                                        } }
                                    ]
                                }
                            ].concat(Shop.langs.map(function (l) {
                                return { dataField: l.code, caption: '选项名称 (' + l.code + ')', validationRules: [{ type: 'stringLength', max: 100, message: '最长 100 个字符' }] };
                            }), [{ type: 'buttons', width: 80, buttons: ['edit', 'delete'] }])
                        });
                    },
                    onHidden: function () { $pop.dxPopup('dispose'); $pop.remove(); }
                });
                $pop.dxPopup('show');
            }
        }

        // 各语言的可选值：只是承载译文的隐藏列（编辑走上面的选项弹窗），列表里不显示
        var optLangCols = Shop.langs.map(function (l) {
            return { dataField: 'i18n.' + l.code + '.options', caption: '可选值 (' + l.code + ')', visible: false, showInColumnChooser: false,
                     allowFiltering: false, allowSorting: false, formItem: { visible: false } };
        });

        grid = new DxGrid($('#attrGrid')[0], {
            dataSource: DxGrid.restStore('/api/v1/shop/attributes', 'id'),
            keyExpr: 'id',
            gridKey: '/goodsAttributes#v3',   // 换新的布局记忆键：v2 布局里存着旧的单分类列 category_id
            // 拖动行排序：服务端按新顺序重排所有属性的排序值
            rowReorder: function (i) { return Shop.call('POST', '/attributes/move', { id: i.key, target_id: i.targetKey, after: i.after }); },
            editing: {
                mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
                texts: {
                    addRow: '新增属性', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                    confirmDeleteTitle: '删除属性',
                    confirmDeleteMessage: '确定删除该属性吗？已录入商品的属性值会保留在商品里，但不再显示'
                },
                popup: {
                    title: '商品属性', width: 640, height: 'auto', showTitle: true,
                    // 弹窗打开后按当前录入方式初始化字段显隐（表单自己的 onContentReady 被表格占用了）
                    onShown: function (e) { toggleByType($(e.component.content()).find('.dx-form').dxForm('instance'), editingType()); }
                },
                form: {
                    colCount: 1, labelLocation: 'left',
                    items: ['name'].concat(Shop.langItems('name'), ['category_ids', 'input_type', 'options', 'decimal_places', 'unit'],
                        // 各语言单位的 dataField 带点号，itemOption 会当成路径找不到；放进一个命名分组，整组显隐。
                        // 表单项保持普通字符串（带 name 的对象项表格不会当成列的编辑项记录改动）
                        [{ itemType: 'group', name: 'unitI18n', items: Shop.langItems('unit') }],
                        ['is_required', 'sort_order', 'status'])
                }
            },
            onInitNewRow: function (e) {
                e.data.category_ids = []; e.data.input_type = 'text'; e.data.options = [];
                e.data.is_required = false; e.data.sort_order = 0; e.data.status = true;
                e.data.decimal_places = 0; e.data.unit = '';
                e.data.i18n = Shop.blankI18n(['name', 'unit']);
                Shop.langs.forEach(function (l) { e.data.i18n[l.code].options = []; });
            },
            onRowDblClick: function (e) { if (e.rowType === 'data') { e.component.editRow(e.rowIndex); } },
            // 录入方式变了就切换字段显隐。注意：不能覆盖表单的 onFieldDataChanged（表格靠它记录改动），
            // 这里按官方做法包一层编辑器的 onValueChanged
            onEditorPreparing: function (e) {
                if (e.parentType === 'dataRow' && e.dataField === 'input_type') {
                    var orig = e.editorOptions.onValueChanged;
                    e.editorOptions.onValueChanged = function (args) {
                        if (orig) { orig.apply(this, arguments); }
                        toggleByType($(grid.element()).closest('body').find('.dx-popup-content .dx-form').dxForm('instance'), args.value);
                    };
                }
            },
            onToolbarPreparing: function (e) {
                e.toolbarOptions.items.forEach(function (item) {
                    if (item.name === 'addRowButton') {
                        item.showText = 'always'; item.location = 'before';
                        item.options = $.extend(item.options, { type: 'default', stylingMode: 'contained' });
                    }
                });
            },
            onRowInserted: function () { DevExpress.ui.notify('属性已新增', 'success', 1800); },
            onRowUpdated: function () { DevExpress.ui.notify('属性已保存', 'success', 1800); },
            onRowRemoved: function () { DevExpress.ui.notify('属性已删除', 'success', 1800); },
            columns: Shop.withLang(Shop.withLang(Shop.withLang([
                { dataField: 'id', caption: 'ID', width: 70, allowEditing: false, formItem: { visible: false } },
                {
                    dataField: 'name', caption: '属性名称',
                    validationRules: [{ type: 'required', message: '请输入属性名称' }, { type: 'stringLength', max: 100, message: '最长 100 个字符' }]
                },
                {
                    dataField: 'category_ids', caption: '适用分类（含下级）', minWidth: 200,
                    editorType: 'dxTagBox', allowFiltering: false,
                    editorOptions: {
                        dataSource: Shop.categorySource(), valueExpr: 'id', displayExpr: 'full_name',
                        searchEnabled: true, showClearButton: true, multiline: false,
                        placeholder: '不选 = 通用（所有分类）'
                    },
                    cellTemplate: function (el, o) {
                        var ids = o.value || [];
                        el.text(ids.length ? ids.map(function (id) { return catNames[id] || ('#' + id); }).join('、') : '通用（所有分类）')
                          .attr('title', ids.map(function (id) { return catNames[id] || ('#' + id); }).join('、'));
                    }
                },
                {
                    dataField: 'input_type', caption: '录入方式', width: 110,
                    lookup: { dataSource: [{ id: 'text', n: '文本' }, { id: 'textarea', n: '多行文本' }, { id: 'select', n: '单选' }, { id: 'multiselect', n: '多选' }, { id: 'number', n: '数字' }], valueExpr: 'id', displayExpr: 'n' }
                },
                {
                    dataField: 'options', caption: '可选值', allowFiltering: false, allowSorting: false,
                    calculateCellValue: function (r) { return r.options || []; },
                    cellTemplate: function (el, o) {  // 列表只显示默认语言，超过 20 个字符省略（完整内容放在悬停提示里）
                        var t = (o.value || []).join('、');
                        el.text(t.length > 20 ? t.slice(0, 20) + '…' : t).attr('title', t);
                    },
                    editCellTemplate: optionsEditor
                },
                {
                    dataField: 'decimal_places', caption: '小数位数', dataType: 'number', width: 90,
                    editorOptions: { min: 0, max: 6, showSpinButtons: true },
                    validationRules: [{ type: 'range', min: 0, max: 6, message: '小数位数需在 0~6 之间' }],
                    cellTemplate: function (el, o) { el.text(o.data.input_type === 'number' ? (o.value ? o.value : '整数') : ''); }
                },
                {
                    dataField: 'unit', caption: '单位',
                    editorOptions: { placeholder: '如 ml、g、cm（默认语言）' },
                    validationRules: [{ type: 'stringLength', max: 30, message: '最长 30 个字符' }]
                },
                { dataField: 'is_required', caption: '必填', dataType: 'boolean', width: 70 },
                { dataField: 'sort_order', caption: '排序', dataType: 'number', width: 80 },
                { dataField: 'status', caption: '启用', dataType: 'boolean', width: 80 },
                { type: 'buttons', width: 80, buttons: ['edit', 'delete'] }
            ], 'name', Shop.langColumns('name', '属性名称')), 'options', optLangCols), 'unit', Shop.langColumns('unit', '单位'))
        });
    });
});
</script>
<style>
.opt-bar { display: flex; align-items: center; gap: 10px; }
.opt-sum { color: #8a8a8a; font-size: 12px; }
</style>
{% endblock %}
