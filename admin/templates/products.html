{% extends "page.html" %}
{% block title %}采集商品{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="productGrid"></div>
</div>
<script>
var PLATFORMS = { ebay: 'eBay' };
var REVIEW_TYPES = [{ id: 'product', n: '商品评价' }, { id: 'seller', n: '卖家反馈' }];

function renderAttrs($box, title, obj) {
    var keys = Object.keys(obj || {});
    if (!keys.length) { return; }
    var $t = $('<table class="attr-table"></table>');
    keys.forEach(function (k) {
        var v = obj[k];
        $t.append($('<tr></tr>').append($('<th></th>').text(k), $('<td></td>').text(Array.isArray(v) ? v.join(', ') : v)));
    });
    $box.append($('<div class="attr-title"></div>').text(title), $t);
}

function subGrid(el, url, columns) {
    new DxGrid($('<div></div>').appendTo(el)[0], {
        dataSource: DxGrid.restStore(url, 'id'),
        height: 'auto', autoHeight: false, dxFeatures: false, searchPanel: { visible: false }, filterRow: { visible: false },
        columns: columns
    });
}

function detailTabs(productId) {
    var base = '/api/v1/products/' + productId;
    return $('<div></div>').dxTabPanel({
        deferRendering: true,
        animationEnabled: false,
        items: [
            { title: '商品属性', template: function (_, __, el) {
                var $box = $('<div class="attr-box">加载中...</div>').appendTo(el);
                $.getJSON(base).done(function (res) {
                    $box.empty();
                    renderAttrs($box, '搜索属性', res.data.search_attrs);
                    renderAttrs($box, '其他属性', res.data.attributes);
                    if (!$box.children().length) { $box.text('暂无属性'); }
                }).fail(function () { $box.text('加载失败'); });
            } },
            { title: '评价', template: function (_, __, el) {
                subGrid(el, base + '/reviews', [
                    { dataField: 'reviewed_at', caption: '日期', width: 100 },
                    { dataField: 'review_type', caption: '类型', width: 90, lookup: { dataSource: REVIEW_TYPES, valueExpr: 'id', displayExpr: 'n' } },
                    { dataField: 'rating', caption: '评分', width: 60 },
                    { dataField: 'reviewer_name', caption: '评价人', width: 120 },
                    { dataField: 'title', caption: '标题' },
                    { dataField: 'content', caption: '内容' },
                    { dataField: 'helpful_count', caption: '有帮助', width: 70 },
                    { dataField: 'is_verified', caption: '已验证', dataType: 'boolean', width: 70 }
                ]);
            } },
            { title: '价格趋势', template: function (_, __, el) {
                subGrid(el, base + '/snapshots', [
                    { dataField: 'crawled_at', caption: '采集时间', width: 160 },
                    { dataField: 'price', caption: '价格', dataType: 'number', width: 90 },
                    { dataField: 'currency', caption: '币种', width: 60 },
                    { dataField: 'shipping_price', caption: '运费', dataType: 'number', width: 80 },
                    { dataField: 'view_count', caption: '浏览', width: 80 },
                    { dataField: 'watcher_count', caption: '关注', width: 80 },
                    { dataField: 'sold_count', caption: '已售', width: 80 },
                    { dataField: 'available_qty', caption: '库存', width: 80 },
                    { dataField: 'review_count', caption: '评价数', width: 80 },
                    { dataField: 'review_avg', caption: '评分', width: 70 }
                ]);
            } }
        ]
    });
}

$(function () {
    var ro = { allowEditing: false, formItem: { visible: false } };
    var grid = new DxGrid($('#productGrid')[0], {
        dataSource: DxGrid.restStore('/api/v1/products', 'id'),
        keyExpr: 'id',
        masterDetail: { enabled: true, template: function (el, info) { el.append(detailTabs(info.key)); } },
        editing: {
            mode: 'popup',
            allowUpdating: true,
            allowDeleting: true,
            useIcons: true,
            texts: {
                editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteTitle: '删除商品',
                confirmDeleteMessage: '确定删除该商品吗？其评价和价格快照会一并删除，不可恢复。之后再次采集到时会重新生成'
            },
            popup: { title: '修正商品信息', width: 560, height: 'auto', showTitle: true },
            form: { colCount: 1, labelLocation: 'left', items: ['title', 'brand', 'category_name', 'item_condition', 'mpn', 'upc', 'country_of_origin'] }
        },
        onRowDblClick: function (e) {
            if (e.rowType === 'data') { e.component.editRow(e.rowIndex); }
        },
        onToolbarPreparing: function (e) {
        },
        onRowUpdated: function () { DevExpress.ui.notify('商品已保存', 'success', 1800); },
        onRowRemoved: function () { DevExpress.ui.notify('商品已删除', 'success', 1800); },
        columns: [
            $.extend({ dataField: 'id', caption: 'ID', width: 70 }, ro),
            $.extend({
                dataField: 'image_url', caption: '主图', width: 70, allowFiltering: false, allowSorting: false,
                cellTemplate: function (el, o) {
                    if (o.value && /^https?:\/\//i.test(o.value)) { $('<img class="thumb">').attr('src', o.value).appendTo(el); }
                }
            }, ro),
            {
                dataField: 'title', caption: '标题', minWidth: 260,
                validationRules: [{ type: 'required', message: '标题不能为空' }, { type: 'stringLength', max: 500, message: '最长 500 个字符' }],
                cellTemplate: function (el, o) {
                    var $a = $('<a target="_blank" rel="noopener noreferrer"></a>').text(o.value || '');
                    if (o.data.product_url && /^https?:\/\//i.test(o.data.product_url)) { $a.attr('href', o.data.product_url); }
                    el.append($a);
                }
            },
            $.extend({
                dataField: 'platform', caption: '平台', width: 80,
                lookup: { dataSource: Object.keys(PLATFORMS).map(function (k) { return { id: k, n: PLATFORMS[k] }; }), valueExpr: 'id', displayExpr: 'n' }
            }, ro),
            $.extend({ dataField: 'item_id', caption: '平台编号', width: 130 }, ro),
            { dataField: 'category_name', caption: '分类', width: 150 },
            { dataField: 'brand', caption: '品牌', width: 110 },
            { dataField: 'item_condition', caption: '成色', width: 90 },
            $.extend({ dataField: 'price', caption: '价格', dataType: 'number', width: 90 }, ro),
            $.extend({ dataField: 'currency', caption: '币种', width: 60 }, ro),
            $.extend({ dataField: 'sold_count', caption: '已售', dataType: 'number', width: 80 }, ro),
            $.extend({ dataField: 'view_count', caption: '浏览', dataType: 'number', width: 80 }, ro),
            $.extend({ dataField: 'watcher_count', caption: '关注', dataType: 'number', width: 80 }, ro),
            $.extend({ dataField: 'available_qty', caption: '库存', dataType: 'number', width: 80 }, ro),
            $.extend({ dataField: 'review_count', caption: '评价数', dataType: 'number', width: 80, visible: false }, ro),
            $.extend({ dataField: 'seller_name', caption: '卖家', width: 120 }, ro),
            $.extend({ dataField: 'item_location', caption: '所在地', width: 120, visible: false }, ro),
            { dataField: 'mpn', caption: 'MPN', visible: false },
            { dataField: 'upc', caption: 'UPC', visible: false },
            { dataField: 'country_of_origin', caption: '制造国家/地区', visible: false },
            $.extend({ dataField: 'last_crawled_at', caption: '最近采集', width: 150 }, ro)
        ]
    });
});
</script>
<style>
.thumb { width: 40px; height: 40px; object-fit: contain; display: block; }
.attr-box { padding: 8px 12px; }
.attr-title { font-weight: 600; margin: 8px 0 4px; }
.attr-table { border-collapse: collapse; }
.attr-table th { text-align: left; font-weight: 500; color: #666; padding: 3px 16px 3px 0; white-space: nowrap; vertical-align: top; }
.attr-table td { padding: 3px 0; }
</style>
{% endblock %}
