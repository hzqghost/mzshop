{% extends "page.html" %}
{% block title %}商品详情{% endblock %}
{% block body %}
<div class="edit-bar">
    <div class="edit-title" id="editTitle">商品详情</div>
    <div class="edit-actions">
        <div id="btnSave"></div>
        <div id="btnPush"></div>
    </div>
</div>
<div class="page-pad edit-shell">
    <div class="edit-main">
        <div id="goodsForm"></div>
    </div>
    <nav class="section-nav" id="sectionNav"></nav>
</div>
<script src="/static/js/plugins/tinymce/tinymce.min.js"></script>
<script src="/static/js/lib/shop.js?v=20261120-bundle-stock"></script>
<script>
var params = new URLSearchParams(location.search);
var goodsId = parseInt(params.get('id'), 10) || null;

var SECTIONS = [
    { id: 'sec-base', text: '基本信息' },
    { id: 'sec-images', text: '图片' },
    { id: 'sec-sku', text: '规格 SKU' },
    { id: 'sec-price', text: '价格' },
    { id: 'sec-attr', text: '属性' },
    { id: 'sec-store', text: '店铺' },
    { id: 'sec-desc-zh', text: '中文描述' },
    { id: 'sec-desc-en', text: '英文描述' }
];
var ATTR_TYPES = { text: '文本', textarea: '多行', select: '单选', multiselect: '多选', number: '数字' };
var IMAGE_EXT = { jpg: 1, jpeg: 1, png: 1, gif: 1, webp: 1 };
var saving = false;
var tabMode = false;
try { tabMode = sessionStorage.getItem('goodsEditViewMode') === 'tabs'; } catch (e) { }
var activeSection = 'sec-base';

function sectionAnchor(id) {
    return function (_, el) { $('<div class="sec-anchor"></div>').attr('id', id).appendTo(el); };
}

function blockClass(id) { return 'goods-block goods-block-' + id; }

function highlightNav(id) {
    $('#sectionNav a[data-sec]').removeClass('is-on');
    $('#sectionNav a[data-sec="' + id + '"]').addClass('is-on');
}

function refreshVisibleWidgets() {
    [window._regionGrid, window._attrGrid, window._storeGrid].forEach(function (g) {
        if (g) { try { g.updateDimensions(); } catch (e) { } }
    });
    if (window.tinymce) {
        ['descZh', 'descEn'].forEach(function (id) {
            var ed = tinymce.get(id);
            if (ed) { try { ed.dispatch('ResizeEditor'); } catch (e) { } }
        });
    }
}

function applyViewMode() {
    var $shell = $('.edit-shell');
    $shell.toggleClass('is-tabs', tabMode);
    $shell.removeClass(SECTIONS.map(function (s) { return 'is-' + s.id; }).join(' '));
    $shell.addClass('is-' + activeSection);
    $('.goods-block').removeClass('is-active');
    $('.goods-block-' + activeSection).addClass('is-active');
    $('#navMode').text(tabMode ? '单页模式' : 'Tabs模式');
    if (tabMode) { window.scrollTo(0, 0); }
    highlightNav(activeSection);
    setTimeout(refreshVisibleWidgets, 0);
}

function goSection(id) {
    activeSection = id;
    if (tabMode) { applyViewMode(); return; }
    applyViewMode();
    var el = document.getElementById(id);
    if (!el) { return; }
    var top = el.getBoundingClientRect().top + window.scrollY - 64;
    window.scrollTo(0, Math.max(0, top));
}

function toggleViewMode() {
    tabMode = !tabMode;
    try { sessionStorage.setItem('goodsEditViewMode', tabMode ? 'tabs' : 'page'); } catch (e) { }
    applyViewMode();
}

function buildSectionNav() {
    var $nav = $('#sectionNav').empty();
    SECTIONS.forEach(function (s) {
        $('<a href="javascript:;"></a>').text(s.text).attr('data-sec', s.id).on('click', function () {
            goSection(s.id);
        }).appendTo($nav);
    });
    $('<a href="javascript:;" id="navMode" class="nav-mode"></a>').on('click', toggleViewMode).appendTo($nav);
    if (window._goodsNavSync) {
        window.removeEventListener('scroll', window._goodsNavSync);
        document.removeEventListener('scroll', window._goodsNavSync);
    }
    window._goodsNavSync = syncSectionNav;
    window.addEventListener('scroll', syncSectionNav, { passive: true });
    document.addEventListener('scroll', syncSectionNav, { passive: true });
    applyViewMode();
}

function syncSectionNav() {
    if (tabMode) { highlightNav(activeSection); return; }
    var current = SECTIONS[0].id;
    SECTIONS.forEach(function (s) {
        var el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top <= 88) { current = s.id; }
    });
    activeSection = current;
    $('.edit-shell').removeClass(SECTIONS.map(function (s) { return 'is-' + s.id; }).join(' ')).addClass('is-' + current);
    highlightNav(current);
}

function enLang() {
    return Shop.langs.filter(function (l) { return /^en([-_]|$)/i.test(l.code) || /英文|english/i.test(l.name || ''); })[0] || null;
}

function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function uploadGoodsImage(file) {
    var fd = new FormData();
    fd.append('file', file, file.name || 'image.jpg');
    return $.ajax({ url: '/api/v1/shop/upload', method: 'POST', data: fd, processData: false, contentType: false }).then(function (res) {
        if (!res || res.code !== 0) { return $.Deferred().reject((res && res.msg) || '上传失败').promise(); }
        return res.data.url;
    }, function (xhr) {
        return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '上传失败').promise();
    });
}

function imageFileError(file) {
    var ext = ((file.name || '').split('.').pop() || '').toLowerCase();
    if (!IMAGE_EXT[ext] && (file.type || '').indexOf('image/') !== 0) { return '描述里只能插入 jpg、png、gif、webp'; }
    if (!file.size) { return '文件是空的'; }
    if (file.size > 5 * 1024 * 1024) { return '图片不能超过 5MB'; }
    return '';
}

function filesFromClipboard(e) {
    var cd = e.clipboardData || (e.originalEvent && e.originalEvent.clipboardData);
    if (!cd) { return []; }
    if (cd.files && cd.files.length) { return Array.prototype.slice.call(cd.files); }
    var out = [];
    if (cd.items) {
        for (var i = 0; i < cd.items.length; i++) {
            if (cd.items[i].kind === 'file') {
                var f = cd.items[i].getAsFile();
                if (f) { out.push(f); }
            }
        }
    }
    return out;
}

function insertEditorImage(editor, file) {
    var err = imageFileError(file);
    if (err) { apiError(err); return; }
    uploadGoodsImage(file).then(function (url) {
        editor.insertContent('<img src="' + escHtml(url) + '" alt="">');
    }, apiError);
}

function initHtmlEditor(id, html) {
    if (window.tinymce && tinymce.get(id)) { tinymce.get(id).remove(); }
    tinymce.init({
        selector: '#' + id,
        license_key: 'gpl',
        language: 'zh-CN',
        language_url: '/static/js/plugins/tinymce/langs/zh-CN.js',
        height: 360,
        min_height: 260,
        menubar: false,
        branding: false,
        promotion: false,
        statusbar: false,
        toolbar_mode: 'wrap',
        convert_urls: false,
        paste_data_images: false,
        automatic_uploads: false,
        images_file_types: 'jpg,jpeg,png,gif,webp',
        plugins: 'advlist autolink lists link image table code wordcount fullscreen',
        toolbar: 'undo redo | blocks | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist | link uploadimage table | removeformat code fullscreen',
        content_style: 'body{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:14px;} img{max-width:100%;height:auto;}',
        setup: function (editor) {
            editor.ui.registry.addButton('uploadimage', {
                icon: 'image',
                tooltip: '插入图片',
                onAction: function () {
                    var input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp';
                    input.onchange = function () { if (input.files && input.files[0]) { insertEditorImage(editor, input.files[0]); } };
                    input.click();
                }
            });
            editor.on('paste', function (e) {
                var files = filesFromClipboard(e);
                if (!files.length) { return; }
                e.preventDefault();
                files.forEach(function (file) { insertEditorImage(editor, file); });
            }, true);
            editor.on('drop', function (e) {
                var dt = e.dataTransfer;
                if (!dt || !dt.files || !dt.files.length) { return; }
                e.preventDefault();
                Array.prototype.forEach.call(dt.files, function (file) { insertEditorImage(editor, file); });
            }, true);
            editor.on('init', function () { if (html) { editor.setContent(html); } });
        }
    });
}

function readHtmlEditor(id, fallback) {
    var editor = window.tinymce && tinymce.get(id);
    return editor ? editor.getContent() : (fallback || '');
}

$(function () {
    Shop.ready.then(function () {
        var data = { status: false, cost_price: 0, sale_price: 0, shipping_fee: 0, shipping_package_group_id: 0, region_prices: [], stores: [], category_id: 0, brand_id: 0, supplier_id: 0, catalog_item_id: 0, catalog_item_name: '', catalog_item_sku: '', attr_values: {}, images: [], i18n: Shop.blankI18n(['name', 'description', 'attr_values']) };
        var load = goodsId ? Shop.call('GET', '/goods/' + goodsId) : $.Deferred().resolve(data).promise();
        load.then(function (g) {
            return $.ajax({ url: APP.HOST + '/api/v1/regions', method: 'GET' }).then(function (res) {
                if (!res || res.code !== 0) { return $.Deferred().reject((res && res.msg) || '区域加载失败').promise(); }
                return $.ajax({ url: APP.HOST + '/api/v1/stores', method: 'GET' }).then(function (sres) {
                    if (!sres || sres.code !== 0) { return $.Deferred().reject((sres && sres.msg) || '店铺加载失败').promise(); }
                    return $.ajax({ url: APP.HOST + '/api/v1/shipping-templates', method: 'GET' }).then(function (tres) {
                        if (!tres || tres.code !== 0) { return $.Deferred().reject((tres && tres.msg) || '运费模板加载失败').promise(); }
                        return Shop.call('GET', '/categories').then(function (cats) {
                            return { row: g, regions: res.data || [], stores: sres.data || [], templates: tres.data || [], categories: cats || [] };
                        });
                    });
                }, function (xhr) {
                    return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '店铺加载失败').promise();
                });
            }, function (xhr) {
                return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '区域加载失败').promise();
            });
        }).then(function (pack) {
            build($.extend(data, pack.row), pack.regions, pack.stores, pack.templates, pack.categories);
        }, function (msg) { apiError(msg); $('#goodsForm').text('商品加载失败：' + msg); });
    });
});

function regionRows(row) {
    var list = (row.region_prices || []).map(function (r) {
        return {
            id: r.id, region_id: r.region_id,
            price: r.price, suggested_price: r.suggested_price, min_price: r.min_price, max_price: r.max_price,
            currency: r.currency || '', shipping_fee: r.shipping_fee,
            arrival_days_min: r.arrival_days_min, arrival_days_max: r.arrival_days_max, tax: r.tax
        };
    });
    if (list.length) { return list; }
    var hasPrice = row.sale_price !== null && row.sale_price !== undefined && Number(row.sale_price) !== 0;
    var hasShip = row.shipping_fee !== null && row.shipping_fee !== undefined && Number(row.shipping_fee) !== 0;
    if (!hasPrice && !hasShip) { return []; }
    return [{
        region_id: null, price: row.sale_price, suggested_price: null, min_price: null, max_price: null,
        currency: '', shipping_fee: row.shipping_fee,
        arrival_days_min: null, arrival_days_max: null, tax: null
    }];
}

function currencySource() {
    function load() {
        return $.ajax({ url: APP.HOST + '/api/v1/attrs/options?code=currency', method: 'GET' }).then(function (res) {
            if (!res || res.code !== 0) { return $.Deferred().reject((res && res.msg) || '币种加载失败').promise(); }
            return res.data || [];
        }, function (xhr) {
            return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '币种加载失败').promise();
        });
    }
    return new DevExpress.data.CustomStore({
        key: 'code', loadMode: 'raw', cacheRawData: false, load: load,
        byKey: function (k) {
            if (!k) { return { code: '', label: '' }; }
            return load().then(function (rows) {
                return rows.filter(function (r) { return r.code === k; })[0] || { code: k, label: k + '（未在币种中）' };
            });
        }
    });
}

function build(data, regions, allStores, shippingTemplates, categories) {
    // 之后才新增的语言补上空译文，保证表单能绑定
    data.i18n = data.i18n || {};
    Shop.langs.forEach(function (l) {
        data.i18n[l.code] = $.extend({ name: '', description: '', attr_values: {} }, data.i18n[l.code]);
    });
    data.images = (data.images || []).map(function (image) {
        return typeof image === 'string' ? { url: image, sku_id: null } : $.extend({ sku_id: null }, image);
    });
    var form, $images, $attrHost, $bindHost, regionGrid, attrGrid, storeGrid, english = enLang(), attrToken = 0;
    var imageSkus = [];
    var attrCategory = data.category_id || 0;
    allStores = allStores || [];
    shippingTemplates = (shippingTemplates || []).filter(function (t) { return t.status; });
    var catById = {};
    (categories || []).forEach(function (c) { catById[c.id] = c; });
    regions = (regions || []).slice().sort(function (a, b) {
        return (a.sort_order - b.sort_order) || (a.id - b.id);
    });
    var regionRank = {};
    regions.forEach(function (r) { regionRank[r.id] = r.sort_order; });
    data.region_prices = regionRows(data);
    data.region_prices.forEach(function (r, i) {
        r._kid = r.id || ('n' + i);
        r.region_sort = r.region_id ? regionRank[r.region_id] : 1000000;
    });
    data.stores = (data.stores || []).map(function (r, i) {
        return $.extend({}, r, { _kid: r.id || ('n' + i), allowed: !!r.allowed });
    });
    setTitle();

    $('#btnSave').dxButton({ text: '保存', type: 'default', stylingMode: 'contained', icon: 'save', onClick: save });
    var pushButton = $('#btnPush').dxDropDownButton({
        text: '推送', icon: 'upload', stylingMode: 'contained', disabled: !goodsId,
        keyExpr: 'id', displayExpr: 'text', items: [{ id: 'shopify', text: 'Shopify' }],
        onItemClick: function (e) {
            if (e.itemData.id !== 'shopify' || !goodsId) { return; }
            DevExpress.ui.dialog.confirm('确定把当前商品加入 Shopify 推送队列吗？', '推送商品').then(function (yes) {
                if (!yes) { return; }
                $.ajax({ url: APP.HOST + '/api/v1/shopify/goods/' + goodsId + '/enqueue', method: 'POST',
                    contentType: 'application/json', data: '{}' }).then(function (res) {
                    var d = res.data || {};
                    DevExpress.ui.notify('已创建 ' + (d.created || 0) + ' 个推送任务，跳过 ' + (d.skipped || 0) + ' 个重复任务',
                        d.created ? 'success' : 'warning', 2800);
                }, function (xhr) {
                    apiError((xhr.responseJSON && xhr.responseJSON.msg) || '加入 Shopify 推送队列失败');
                });
            });
        }
    }).dxDropDownButton('instance');

    form = $('#goodsForm').dxForm({
        formData: data, colCount: 2, labelLocation: 'left', alignItemLabels: true,
        onContentReady: buildSectionNav,
        items: [
            { itemType: 'group', caption: '基本信息', colCount: 2, colSpan: 2, labelLocation: 'left', cssClass: blockClass('sec-base'), items: [
                { colSpan: 2, label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-base') },
                {
                    dataField: 'goods_no', label: { text: '商品编码' },
                    editorOptions: { buttons: [{
                        name: 'generate', location: 'after',
                        options: {
                            text: '自动生成', stylingMode: 'text',
                            onClick: function () {
                                var values = form.option('formData') || data;
                                Shop.call('POST', '/goods-no/generate', { category_id: values.category_id || 0, brand_id: values.brand_id || 0 })
                                    .then(function (res) {
                                        form.updateData('goods_no', res.goods_no);
                                        DevExpress.ui.notify('商品编码已生成，该流水号已占用', 'success', 1800);
                                    }, apiError);
                            }
                        }
                    }] },
                    validationRules: [{ type: 'required', message: '请输入商品编码' }, { type: 'stringLength', max: 64, message: '最长 64 个字符' }]
                },
                {
                    dataField: 'status', label: { text: '上架' }, editorType: 'dxSwitch',
                    editorOptions: {
                        disabled: !(data.stores && data.stores.length),
                        onValueChanged: function (e) {
                            if (e.value && !storeRecordCount()) {
                                e.component.option('value', false);
                                data.status = false;
                                apiError('请先在「店铺」里添加记录，上架才能生效');
                            }
                        }
                    }
                },
                { dataField: 'name', label: { text: '商品名称' }, validationRules: [{ type: 'required', message: '请输入商品名称' }, { type: 'stringLength', max: 200, message: '最长 200 个字符' }] },
                ...Shop.langs.map(function (l) {
                    var rules = [{ type: 'stringLength', max: 200, message: '最长 200 个字符' }];
                    if (english && l.code === english.code) {
                        rules.unshift({ type: 'required', message: '请输入商品名称 (en)' });
                    }
                    return { dataField: 'i18n.' + l.code + '.name', label: { text: '商品名称 (' + l.code + ')' }, validationRules: rules };
                }),
                {
                    dataField: 'category_id', label: { text: '分类（仅末级）' }, editorType: 'dxLookup', isRequired: true,
                    validationRules: [{ type: 'custom', message: '请选择分类', validationCallback: function (e) { return !!e.value; } }],
                    editorOptions: Shop.dictLookup({
                        dataSource: Shop.leafCategorySource(), displayExpr: 'full_name', placeholder: '请选择分类',
                        onValueChanged: function (e) {
                            var next = e.value || 0;
                            if (next === attrCategory) { return; }
                            attrCategory = next;
                            reloadAttrs();
                        }
                    })
                },
                {
                    dataField: 'brand_id', label: { text: '品牌' }, editorType: 'dxLookup', isRequired: true,
                    validationRules: [{ type: 'custom', message: '请选择品牌', validationCallback: function (e) { return !!e.value; } }],
                    editorOptions: Shop.dictLookup({ dataSource: Shop.brandSource(), displayExpr: 'name', placeholder: '请选择品牌' })
                },
                {
                    dataField: 'supplier_id', label: { text: '供应商' }, editorType: 'dxLookup', isRequired: true,
                    validationRules: [{ type: 'custom', message: '请选择供应商', validationCallback: function (e) { return !!e.value; } }],
                    editorOptions: Shop.dictLookup({ dataSource: Shop.supplierSource(), displayExpr: 'name', placeholder: '请选择供应商' })
                },
                { label: { text: '绑定产品' }, template: function (_, el) {
                    $bindHost = $('<div class="bind-product"></div>').appendTo(el);
                    renderBind();
                    $('<div class="media-hint"></div>').text('绑定产品池里的一条产品后，可点名称在内部标签打开产品详情。').appendTo(el);
                } },
                { dataField: 'weight_g', label: { text: '重量（克）' }, editorType: 'dxNumberBox', editorOptions: { min: 0, format: '#,##0', showSpinButtons: false } },
                { dataField: 'shipping_package_group_id', label: { text: '默认包装组' }, editorType: 'dxSelectBox',
                  editorOptions: { dataSource: Shop.packageGroupSource('继承店铺'), valueExpr: 'id', displayExpr: 'name', searchEnabled: true } },
                { dataField: 'cost_price', label: { text: '拿货价' }, editorType: 'dxNumberBox', editorOptions: { min: 0, format: '#,##0.00', showSpinButtons: false } },
                { dataField: 'source_url', label: { text: '货源链接' }, colSpan: 2, validationRules: [{ type: 'pattern', pattern: '^$|^https?://', message: '需以 http:// 或 https:// 开头' }] }
            ] },
            { itemType: 'group', caption: '图片', colSpan: 2, cssClass: blockClass('sec-images'), items: [
                { label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-images') },
                { label: { visible: false }, template: function (_, el) {
                    $images = $('<div class="img-list"></div>').appendTo(el);
                    renderImages();
                    $('<div class="media-hint"></div>').text('默认是商品共用图片；可下拉指定某个 SKU。第一张共用图片为主图，最多 20 张。').appendTo(el);
                } }
            ] },
            { itemType: 'group', caption: '规格（SKU）', colSpan: 2, cssClass: blockClass('sec-sku'), items: [
                { label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-sku') },
                { label: { visible: false }, template: function (_, el) {
                    $('<div id="skuSection" class="sku-section"></div>').appendTo(el);
                } }
            ] },
            { itemType: 'group', caption: '区域销售价格', colSpan: 2, cssClass: blockClass('sec-price'), items: [
                { label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-price') },
                { label: { visible: false }, template: function (_, el) {
                    var $grid = $('<div class="region-price-grid"></div>').appendTo(el);
                    regionGrid = new DxGrid($grid[0], regionGridOptions());
                    window._regionGrid = regionGrid;
                    setTimeout(function () { regionGrid.updateDimensions(); }, 0);
                    $('<div class="media-hint"></div>').text('每个销售区域可选择自己的运费模板；未配置不影响上架，只在计算运费时提示。所有 SKU 默认继承区域统一价格。').appendTo(el);
                } }
            ] },
            { itemType: 'group', caption: '属性', colSpan: 2, cssClass: blockClass('sec-attr'), items: [
                { label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-attr') },
                { label: { visible: false }, template: function (_, el) {
                    $attrHost = $('<div class="attr-grid-host"></div>').appendTo(el);
                    $('<div class="media-hint"></div>').text('在表格里维护属性值。文本和多行文本按语言填写；单选、多选和数字的其它语言由「商品属性」里的译文决定，这里只显示。').appendTo(el);
                    renderAttrs();
                } }
            ] },
            { itemType: 'group', caption: '店铺', colSpan: 2, cssClass: blockClass('sec-store'), items: [
                { label: { visible: false }, cssClass: 'sec-anchor-item', template: sectionAnchor('sec-store') },
                { label: { visible: false }, template: function (_, el) {
                    var $grid = $('<div class="store-grid"></div>').appendTo(el);
                    storeGrid = new DxGrid($grid[0], storeGridOptions());
                    window._storeGrid = storeGrid;
                    setTimeout(function () { storeGrid.updateDimensions(); }, 0);

    function collectRegionPrices() {
        var rows = [], seen = {}, error = '';
        function blankNum(v) { return v === undefined || v === '' ? null : v; }
        data.region_prices.forEach(function (r) {
            var empty = !r.region_id && priceNum(r.price) === null && priceNum(r.suggested_price) === null
                && priceNum(r.min_price) === null && priceNum(r.max_price) === null && !r.currency
                && priceNum(r.shipping_fee) === null && priceNum(r.arrival_days_min) === null
                && priceNum(r.arrival_days_max) === null && priceNum(r.tax) === null;
            if (empty) { return; }
            if (!r.region_id) { error = error || '请为区域价格选择区域'; return; }
            if (seen[r.region_id]) { error = error || '同一个区域只能有一条价格'; return; }
            seen[r.region_id] = 1;
            if (!rowPriceOk(r)) { error = error || '建议售价需在最低售价和最高售价之间'; return; }
            if (!rowDaysOk(r)) { error = error || '最快到达天数不能大于最慢到达天数'; return; }
            rows.push({
                region_id: r.region_id,
                price: blankNum(r.price), suggested_price: blankNum(r.suggested_price),
                min_price: blankNum(r.min_price), max_price: blankNum(r.max_price),
                currency: r.currency || '', shipping_template_id: r.shipping_template_id || 0,
                shipping_fee: blankNum(r.shipping_fee),
                arrival_days_min: blankNum(r.arrival_days_min), arrival_days_max: blankNum(r.arrival_days_max),
                tax: blankNum(r.tax)
            });
        });
        return { rows: rows, error: error };
    }

    function goodsCategoryChain(cid) {
        var ids = [], seen = {};
        while (cid && catById[cid] && !seen[cid]) {
            ids.push(cid);
            seen[cid] = 1;
            cid = catById[cid].parent_id || 0;
        }
        return ids;
    }

    function storeMatchesCategory(s, cid) {
        if (!cid || !s) { return false; }
        var chain = {};
        goodsCategoryChain(cid).forEach(function (id) { chain[id] = 1; });
        return (s.category_ids || []).some(function (id) { return chain[id]; });
    }

    /* 属性：按当前分类取「通用 + 该分类」的属性定义，在表格里改，保存时写回 data.attr_values */

    function buildAttrRow(a) {
        var raw = data.attr_values ? data.attr_values[a.name] : undefined;
        var value;
        if (a.input_type === 'multiselect') { value = Array.isArray(raw) ? raw.slice() : []; }
        else if (a.input_type === 'number') { value = raw === undefined || raw === null || raw === '' || isNaN(Number(raw)) ? null : Number(raw); }
        else if (a.input_type === 'select') { value = raw || null; }
        else { value = raw || ''; }
        var row = {
            id: a.id, name: a.name, input_type: a.input_type, is_required: !!a.is_required,
            options: a.options || [], decimal_places: a.decimal_places || 0, unit: a.unit || '',
            optionI18n: {}, unitI18n: {}, value: value
        };
        Shop.langs.forEach(function (l) {
            var pack = a.i18n && a.i18n[l.code] ? a.i18n[l.code] : {};
            row.optionI18n[l.code] = pack.options || [];
            row.unitI18n[l.code] = pack.unit || '';
            var bag = data.i18n[l.code] && data.i18n[l.code].attr_values;
            row['tr_' + l.code] = (bag && bag[a.name]) || '';
        });
        return row;
    }

    function optionText(row, code, value) {
        var opts = row.options || [];
        var tr = (row.optionI18n && row.optionI18n[code]) || [];
        function one(v) {
            var i = opts.indexOf(v);
            return (i >= 0 && tr[i]) || v;
        }
        if (Array.isArray(value)) { return value.map(one).join('、'); }
        return value ? one(value) : '';
    }

    function commitAttrs() {
        if (!attrGrid) { return; }

        var values = {};
        Shop.langs.forEach(function (l) {
            if (!data.i18n[l.code]) { data.i18n[l.code] = { name: '', description: '', attr_values: {} }; }
            data.i18n[l.code].attr_values = {};
        });
        rows.forEach(function (r) {
            var v = r.value;
            if (r.input_type === 'multiselect') {
                v = Array.isArray(v) ? v : [];
                if (v.length) { values[r.name] = v; }
            } else if (r.input_type === 'number') {
                if (v !== null && v !== undefined && v !== '' && !isNaN(Number(v))) {
                    values[r.name] = Number(v).toFixed(r.decimal_places || 0);
                }
            } else if (v) {
                values[r.name] = v;
            }
            if (r.input_type === 'text' || r.input_type === 'textarea') {
                Shop.langs.forEach(function (l) {
                    var t = r['tr_' + l.code];
                    if (t) { data.i18n[l.code].attr_values[r.name] = t; }
                });
            }
        });
        data.attr_values = values;
    }

        var cols = [
            {
                dataField: 'name', caption: '属性', width: 160, allowEditing: false,
                cellTemplate: function (el, info) {
                    el.text(info.value || '');
                    if (info.data.is_required) { $('<span class="attr-req"> *</span>').appendTo(el); }
                }
            },
            {
                dataField: 'input_type', caption: '类型', width: 72, allowEditing: false,
                customizeText: function (e) { return ATTR_TYPES[e.value] || e.value || ''; }
            },
            {
                dataField: 'value', caption: '属性值', minWidth: 180,
                validationRules: [{ type: 'custom', message: '请填写必填属性', validationCallback: valueRequired }],
                calculateDisplayValue: function (row) {
                    if (row.input_type === 'multiselect') { return (row.value || []).join('、'); }
                    if (row.input_type === 'number') {
                        if (row.value === null || row.value === undefined || row.value === '' || isNaN(Number(row.value))) { return ''; }
                        var text = Number(row.value).toFixed(row.decimal_places || 0);
                        return row.unit ? text + ' ' + row.unit : text;
                    }
                    return row.value || '';
                }
            }
        ];
        Shop.langs.forEach(function (l) {
            cols.push({
                dataField: 'tr_' + l.code, caption: l.name || l.code, minWidth: 160,
                calculateDisplayValue: function (row) {
                    if (row.input_type === 'select' || row.input_type === 'multiselect') { return optionText(row, l.code, row.value); }
                    if (row.input_type === 'number') {
                        if (row.value === null || row.value === undefined || row.value === '' || isNaN(Number(row.value))) { return ''; }
                        var u = (row.unitI18n && row.unitI18n[l.code]) || row.unit || '';
                        var text = Number(row.value).toFixed(row.decimal_places || 0);
                        return u ? text + ' ' + u : text;
                    }
                    return row['tr_' + l.code] || '';
                }
            });
        });
        return cols;
    }

    function attrGridOptions(rows) {
        return {
            dataSource: rows,
            keyExpr: 'id',
            height: Math.max(180, Math.min(520, 56 + rows.length * 36)),
            dxFeatures: false,
            selection: { mode: 'none' },
            scrolling: { mode: 'standard', showScrollbar: 'always', useNative: true },
            paging: { enabled: false },
            pager: { visible: false },
            filterRow: { visible: false },
            headerFilter: { visible: false },
            searchPanel: { visible: false },
            sorting: { mode: 'none' },
            noDataText: '该分类暂无属性，可在「商品属性」里配置',
            editing: {
                mode: 'cell', allowAdding: false, allowUpdating: true, allowDeleting: false,
                startEditAction: 'click'
            },
            onEditorPreparing: function (e) {
                if (e.parentType !== 'dataRow' || !e.row || !e.row.data) { return; }
                var row = e.row.data;
                if (e.dataField === 'value') {
                    if (row.input_type === 'select') {
                        e.editorName = 'dxSelectBox';
                        e.editorOptions.items = row.options || [];
                        e.editorOptions.showClearButton = true;
                        e.editorOptions.searchEnabled = true;
                        e.editorOptions.placeholder = '请选择';
                    } else if (row.input_type === 'multiselect') {
                        e.editorName = 'dxTagBox';
                        e.editorOptions.items = row.options || [];
                        e.editorOptions.showClearButton = true;
                        e.editorOptions.showSelectionControls = true;
                        e.editorOptions.applyValueMode = 'instantly';
                        e.editorOptions.placeholder = '请选择（可多选）';
                    } else if (row.input_type === 'number') {
                        e.editorName = 'dxNumberBox';
                        e.editorOptions.showSpinButtons = false;
                        e.editorOptions.format = { type: 'fixedPoint', precision: row.decimal_places || 0 };
                        e.editorOptions.step = row.decimal_places ? Math.pow(10, -row.decimal_places) : 1;
                    } else if (row.input_type === 'textarea') {
                        e.editorName = 'dxTextArea';
                        e.editorOptions.height = 72;
                        e.editorOptions.maxLength = 2000;
                    } else {
                        e.editorName = 'dxTextBox';
                        e.editorOptions.maxLength = 200;
                    }
                }
                if (e.dataField && e.dataField.indexOf('tr_') === 0) {
                    if (row.input_type !== 'text' && row.input_type !== 'textarea') { e.cancel = true; return; }
                    if (row.input_type === 'textarea') {
                        e.editorName = 'dxTextArea';
                        e.editorOptions.height = 72;
                        e.editorOptions.maxLength = 2000;
                    } else {
                        e.editorOptions.maxLength = 200;
                    }
                }
            },
            columns: attrColumns()
        };
    }

    function renderAttrs() {
        if (!$attrHost) { return; }
        var token = ++attrToken;
        if (attrGrid) { attrGrid.dispose(); attrGrid = null; }
        $attrHost.empty().text('加载中...');
        Shop.call('GET', '/attributes?category_id=' + (data.category_id || 0)).then(function (attrs) {
            if (token !== attrToken) { return; }
            var rows = (attrs || []).map(buildAttrRow);
            $attrHost.empty();
            try {
                attrGrid = new DxGrid($('<div class="attr-grid"></div>').appendTo($attrHost)[0], attrGridOptions(rows));
                window._attrGrid = attrGrid;
            } catch (err) {
                $attrHost.text('属性表格创建失败：' + (err && err.message ? err.message : err));
                return;
            }
            setTimeout(function () { if (attrGrid) { attrGrid.updateDimensions(); } }, 0);
        }, function (msg) {
            if (token === attrToken) { $attrHost.text('属性加载失败：' + msg); }
        });
    }

    function reloadAttrs() {
        var ready = attrGrid && attrGrid.hasEditData() ? attrGrid.saveEditData() : $.Deferred().resolve().promise();
        $.when(ready).always(function () {
            if (attrGrid) { commitAttrs(); }
            renderAttrs();
        });
    }

    function imageSkuText(sku) { return sku.sku_code + (sku.spec_name ? ' · ' + sku.spec_name : ''); }

    function refreshImageSkus() {
        if (!goodsId) { imageSkus = []; renderImages(); return; }
        Shop.call('GET', '/goods/' + goodsId + '/skus').then(function (rows) {
            imageSkus = rows || [];
            renderImages();
        }, apiError);
    }

    /* 图片：不绑定 SKU 表示商品共用；绑定后仅用于对应规格。保存时整体提交。 */
    function renderImages() {
        $images.empty();
        var mainIndex = -1;
        data.images.some(function (image, index) {
            if (!image.sku_id) { mainIndex = index; return true; }
            return false;
        });
        data.images.forEach(function (image, i) {
            var $it = $('<div class="img-item"></div>').appendTo($images);
            $('<a class="img-open" target="_blank" rel="noopener"></a>').attr('href', image.url).attr('title', '查看大图')
                .append($('<img alt="">').attr('src', image.url))
                .appendTo($it);
            if (i === mainIndex) { $('<span class="img-main">主图</span>').appendTo($it); }
            var $select = $('<select class="img-sku"></select>').append($('<option value="">商品共用</option>'));
            imageSkus.forEach(function (sku) {
                $('<option></option>').val(sku.id).text(imageSkuText(sku)).appendTo($select);
            });
            $select.val(image.sku_id || '').on('change', function () {
                image.sku_id = parseInt(this.value, 10) || null;
                renderImages();
            }).appendTo($it);
            var $bar = $('<div class="img-bar"></div>').appendTo($it);
            if (!image.sku_id && i !== mainIndex) {
                $('<a href="javascript:;">设为主图</a>').on('click', function () {
                    data.images.unshift(data.images.splice(i, 1)[0]); renderImages();
                }).appendTo($bar);
            }
            $('<a href="javascript:;">删除</a>').on('click', function () { data.images.splice(i, 1); renderImages(); }).appendTo($bar);
        });
        if (data.images.length < 20) {
            var $add = $('<div class="img-add">+ 上传</div>').appendTo($images);
            var $file = $('<input type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none">').appendTo($add);
            $add.on('click', function () { $file.trigger('click'); });
            $file.on('click', function (e) { e.stopPropagation(); }).on('change', function () { uploadFiles(this.files); this.value = ''; });
        }
    }

    function uploadFiles(files) {
        var list = Array.prototype.slice.call(files, 0, 20 - data.images.length);
        var chain = $.Deferred().resolve().promise();
        list.forEach(function (f) {
            chain = chain.then(function () {
                var fd = new FormData();
                fd.append('file', f);
                return $.ajax({ url: '/api/v1/shop/upload', method: 'POST', data: fd, processData: false, contentType: false }).then(function (res) {
                    if (res.code !== 0) { return $.Deferred().reject(res.msg).promise(); }
                    data.images.push({ url: res.data.url, sku_id: null }); renderImages();
                }, function (xhr) { return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '上传失败').promise(); });
            });
        });
        chain.fail(function (msg) { apiError(msg); });
    }

    /* SKU：商品保存过（有 id）才能管理 */
    function renderSkus() {
        var $s = $('#skuSection').empty();
        if (!goodsId) { $('<div class="muted"></div>').text('请先保存商品，再维护规格').appendTo($s); return; }
        Shop.skuGrid($s, goodsId, { hidePager: true, onChanged: refreshImageSkus });
        $('<div class="media-hint"></div>').text('SKU 重量留空时继承商品重量；使用按重量模板计算运费时需要有效重量，但不影响上架。库存请到“库存管理”维护，销售价请在上方“价格 → SKU 区域价格覆盖”中维护。').appendTo($s);
        refreshImageSkus();
    }

    function bindRegionRows(res) {
        data.sale_price = res.sale_price;
        data.shipping_fee = res.shipping_fee;
        data.cost_price = res.cost_price;
        data.region_prices = regionRows(res);
        data.region_prices.forEach(function (r, i) {
            r._kid = r.id || ('n' + i);
            r.region_sort = r.region_id ? (regionRank[r.region_id] == null ? 1000000 : regionRank[r.region_id]) : 1000000;
        });
        if (regionGrid) { regionGrid.option('dataSource', data.region_prices); }
    }

    function bindStoreRows(res) {
        data.stores = (res.stores || []).map(function (r, i) {
            return $.extend({}, r, { _kid: r.id || ('n' + i), allowed: !!r.allowed });
        });
        if (storeGrid) { storeGrid.option('dataSource', data.stores); }
        syncStatusSwitch();
    }

    function flushGrid(grid, failText, sectionId) {
        if (!grid || !grid.hasEditData()) { return $.Deferred().resolve().promise(); }
        var result = grid.saveEditData();
        var promise = result && typeof result.then === 'function' ? result : $.Deferred().resolve().promise();
        return promise.then(function () {
            if (grid.hasEditData()) { goSection(sectionId); return $.Deferred().reject(failText).promise(); }
        }, function () {
            goSection(sectionId);
            return $.Deferred().reject(failText).promise();
        });
    }

    function save() {
        if (saving) { return; }
        if (!form.validate().isValid) { goSection('sec-base'); return; }
        saving = true;
        flushGrid(attrGrid, '属性还有未通过校验的修改', 'sec-attr').then(function () {
            return flushGrid(regionGrid, '区域价格还有未通过校验的修改', 'sec-price');
        }).then(function () {
            return flushGrid(storeGrid, '店铺还有未通过校验的修改', 'sec-store');
        }).then(function () {
            commitAttrs();
            data.description = readHtmlEditor('descZh', data.description);
            if (english && data.i18n[english.code]) {
                data.i18n[english.code].description = readHtmlEditor('descEn', data.i18n[english.code].description);
            }
            var regionPayload = collectRegionPrices();
            if (regionPayload.error) { goSection('sec-price'); return $.Deferred().reject(regionPayload.error).promise(); }
            var storePayload = collectStores();
            if (storePayload.error) { goSection('sec-store'); return $.Deferred().reject(storePayload.error).promise(); }
            if (data.status && !storePayload.rows.length) {
                goSection('sec-store');
                return $.Deferred().reject('请先在「店铺」里添加记录，上架才能生效').promise();
            }
            var body = $.extend({}, data);
            delete body.profit; delete body.margin_pct; delete body.sku_count; delete body.stock;
            delete body.created_at; delete body.updated_at; delete body.main_image_url;
            delete body.sale_price; delete body.shipping_fee;
            delete body.catalog_item_name; delete body.catalog_item_sku;
            body.region_prices = regionPayload.rows;
            body.stores = storePayload.rows;
            var creating = !goodsId;
            var req = creating ? Shop.call('POST', '/goods', body) : Shop.call('PUT', '/goods/' + goodsId, body);
            return req.then(function (res) {
                DevExpress.ui.notify('商品已保存', 'success', 1800);
                Shop.notifyChanged('goods');
                if (creating) {
                    goodsId = res.id;
                    pushButton.option('disabled', false);
                    renderSkus();
                }  // 之后再点保存就是修改，不会重复新增；规格区域随即可用
                bindRegionRows(res);
                bindStoreRows(res);
                if (res.catalog_item_id != null) {
                    data.catalog_item_id = res.catalog_item_id;
                    data.catalog_item_name = res.catalog_item_name || '';
                    data.catalog_item_sku = res.catalog_item_sku || '';
                    renderBind();
                }
                setTitle();
            });
        }).then(null, apiError).always(function () { saving = false; });
    }
}
</script>
