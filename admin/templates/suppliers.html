{% extends "page.html" %}
{% block title %}供应商{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="supplierGrid"></div>
</div>
<script src="/static/js/plugins/tinymce/tinymce.min.js"></script>
<script src="/static/js/lib/supplierCatalog.js?v=20261119-1"></script>
<script>
function disposeRemarkEditor() {
    if (window.tinymce) { tinymce.remove('#supplierRemarkEditor'); }
    if (window.SUP) { SUP.discardMaterialPending(); }
}
function currentRemark() {
    var grid = $('#supplierGrid').dxGrid('instance');
    if (!grid) { return ''; }
    var key = grid.option('editing.editRowKey');
    if (key == null) { return ''; }
    var idx = grid.getRowIndexByKey(key);
    var row = idx >= 0 ? grid.getVisibleRows()[idx] : null;
    return (row && row.data && row.data.remark) || '';
}
function mountRemarkEditor(data, el) {
    disposeRemarkEditor();
    var html = (data.editorOptions && data.editorOptions.value) || currentRemark();
    $('<textarea id="supplierRemarkEditor"></textarea>').appendTo(el);
    SUP.initMaterialEditor('#supplierRemarkEditor', html, { height: 420 });
}
function placeCodeFirst(grid) {
    if (grid.__codeFirst) { return; }
    grid.__codeFirst = true;
    var code = grid.columnOption('code');
    if (code && code.visibleIndex !== 0) { grid.columnOption('code', 'visibleIndex', 0); }
    try {
        if (localStorage.getItem('dxGrid:/suppliers:remarkHide') !== '1') {
            grid.columnOption('remark', 'visible', false);
            localStorage.setItem('dxGrid:/suppliers:remarkHide', '1');
        }
    } catch (e) { /* 记不住就保持当前显隐 */ }
}
$(function () {
    var grid = new DxGrid($('#supplierGrid')[0], {
        dataSource: DxGrid.restStore('/api/v1/supplier-catalog/suppliers', 'id'),
        keyExpr: 'id',
        businessToolbar: true,
        editing: {
            mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
            texts: {
                addRow: '新增供应商', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteMessage: '确定删除该供应商吗？其 Excel 导入模板会一并删除；已有目录条目或文档时不能删除'
            },
            popup: { title: '供应商', width: '90%', maxWidth: 980, height: '80%', maxHeight: 780, showTitle: true },
            form: {
                colCount: 2, labelLocation: 'left',
                items: [
                    'code', 'name',
                    { dataField: 'website', colSpan: 2 },
                    'contact_name', 'contact_phone', 'contact_email', 'default_currency',
                    'status',
                    { itemType: 'empty' },
                    { dataField: 'remark', colSpan: 2, label: { text: '备注' }, cssClass: 'supplier-remark-item', template: mountRemarkEditor }
                ]
            }
        },
        onInitNewRow: function (e) { e.data.status = true; },
        onContentReady: function (e) { placeCodeFirst(e.component); },
        onSaving: function (e) {
            var editor = window.tinymce && tinymce.get('supplierRemarkEditor');
            if (!editor) { return; }
            e.cancel = SUP.flushMaterialEditor(editor).then(function () {
                var html = editor.getContent();
                (e.changes || []).forEach(function (ch) {
                    ch.data = ch.data || {};
                    ch.data.remark = html;
                });
                return false;
            }, function (msg) {
                if (typeof apiError === 'function') { apiError(msg); }
                return true;
            });
        },
        onSaved: disposeRemarkEditor,
        onEditCanceled: disposeRemarkEditor,
        onRowInserted: function () { DevExpress.ui.notify('供应商已新增', 'success', 1800); SUP.notifyChanged('supplier'); },
        onRowUpdated: function () { DevExpress.ui.notify('供应商已保存', 'success', 1800); SUP.notifyChanged('supplier'); },
        onRowRemoved: function () { DevExpress.ui.notify('供应商已删除', 'success', 1800); SUP.notifyChanged('supplier'); },
        columns: [
            { dataField: 'code', caption: '编码', width: 120, visibleIndex: 0, validationRules: [{ type: 'stringLength', max: 50, message: '最长 50 个字符' }] },
            { dataField: 'name', caption: '供应商名称', minWidth: 160, validationRules: [{ type: 'required', message: '请输入供应商名称' }] },
            {
                dataField: 'website', caption: '官网', width: 220, allowFiltering: false, allowSorting: false,
                cellTemplate: function (el, o) {
                    if (o.value) { $('<a class="cell-link" target="_blank"></a>').attr('href', o.value).text(o.value).appendTo(el); }
                }
            },
            { dataField: 'contact_name', caption: '联系人', width: 90 },
            { dataField: 'contact_phone', caption: '电话', width: 130 },
            { dataField: 'contact_email', caption: '邮箱', width: 170 },
            { dataField: 'default_currency', caption: '默认币种', width: 130,
              lookup: { dataSource: SUP.currencySource(), valueExpr: 'code', displayExpr: 'label', allowClearing: true } },
            { dataField: 'item_count', caption: '目录条目', dataType: 'number', width: 80, allowEditing: false, formItem: { visible: false } },
            { dataField: 'document_count', caption: '文档', dataType: 'number', width: 70, allowEditing: false, formItem: { visible: false } },
            { dataField: 'has_mapping', caption: '导入模板', dataType: 'boolean', width: 80, allowEditing: false, formItem: { visible: false } },
            { dataField: 'remark', caption: '备注', visible: false },
            { dataField: 'status', caption: '启用', dataType: 'boolean', width: 70 },
            { dataField: 'id', caption: 'ID', width: 60, allowEditing: false, formItem: { visible: false } },
            { dataField: 'updated_at', caption: '更新时间', width: 150, allowEditing: false, formItem: { visible: false } },
            { type: 'buttons', caption: '操作', width: 80, buttons: ['edit', 'delete'] }
        ]
    });
    // 目录导入后刷新条目数
    SUP.onChanged('catalog', function () { grid.refresh(); });
    SUP.onChanged('document', function () { grid.refresh(); });
});
</script>
<style>
.tox-tinymce-aux, .tox-dialog, .tox-dialog-wrap { z-index: 20000 !important; }
.dx-box-item:has(.supplier-remark-item) { flex: 1 0 100% !important; width: 100% !important; max-width: 100% !important; }
.supplier-remark-item, .supplier-remark-item .dx-field-item-content, .supplier-remark-item .tox-tinymce { width: 100% !important; max-width: 100% !important; box-sizing: border-box; }
.supplier-remark-item .tox-tinymce { border-radius: 4px; }
</style>
{% endblock %}
