{% extends "page.html" %}
{% block title %}标准属性值{% endblock %}
{% block body %}
<div class="page-pad">
    <div class="taxonomy-attribute-toolbar"><div id="refreshTaxonomyAttributes"></div><span id="attributeSummary">浏览 Shopify 官方属性；展开行查看官方属性值。</span></div>
    <div id="taxonomyAttributeGrid"></div>
</div>
<script>
var taxonomyAttributeGrid;
function taxonomyAttrCall(method, path) {
    return $.ajax({url: APP.HOST + '/api/v1/shopify' + path, method: method, contentType:'application/json'}).then(function(res){
        if (!res || res.code !== 0) return $.Deferred().reject((res && res.msg) || '请求失败').promise();
        return res.data;
    }, function(xhr){return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '请求失败').promise();});
}
$(function(){
    taxonomyAttributeGrid = new DxGrid($('#taxonomyAttributeGrid')[0], {
        dataSource: DxGrid.remoteStore('/api/v1/shopify/taxonomy/attributes', 'id'), keyExpr:'id', businessToolbar:true,
        remoteOperations:{paging:true,filtering:true,sorting:true}, headerFilter:{visible:false},
        paging:{pageSize:50}, pager:{visible:true,showPageSizeSelector:true,allowedPageSizes:[20,50,100],showInfo:true},
        masterDetail:{enabled:true,template:function(container,o){
            $('<div></div>').appendTo(container).each(function(){new DxGrid(this, {
                dataSource:DxGrid.remoteStore('/api/v1/shopify/taxonomy/attributes/'+o.data.id+'/values','id'), keyExpr:'id',
                remoteOperations:{paging:true,filtering:true,sorting:true}, headerFilter:{visible:false}, paging:{pageSize:50},
                pager:{visible:true,showPageSizeSelector:true,allowedPageSizes:[20,50,100],showInfo:true},
                columns:[{dataField:'name_zh',caption:'属性值（中文）',minWidth:220},{dataField:'name_en',caption:'属性值（英文）',minWidth:220},
                    {dataField:'handle',caption:'Handle',minWidth:210},{dataField:'is_active',caption:'有效',dataType:'boolean',width:75},
                    {dataField:'taxonomy_gid',caption:'TaxonomyValue GID',minWidth:270,visible:false},{dataField:'version',caption:'版本',width:100}]
            });});
        }},
        columns:[{dataField:'name_zh',caption:'属性（中文）',minWidth:190},{dataField:'name_en',caption:'属性（英文）',minWidth:220},
            {dataField:'handle',caption:'Handle',minWidth:190},{dataField:'value_count',caption:'属性值数',dataType:'number',width:95},
            {dataField:'description_zh',caption:'说明',minWidth:280},{dataField:'is_active',caption:'有效',dataType:'boolean',width:75},
            {dataField:'version',caption:'版本',width:100},{dataField:'taxonomy_gid',caption:'TaxonomyAttribute GID',minWidth:270,visible:false},
            {dataField:'updated_at',caption:'更新时间',dataType:'datetime',format:'yyyy-MM-dd HH:mm:ss',width:165,visible:false}]
    });
    $('#refreshTaxonomyAttributes').dxButton({text:'从 Shopify 更新全部标准数据',icon:'refresh',type:'default',onClick:function(e){
        var b=e.component; DevExpress.ui.dialog.confirm('将更新官方分类、属性、属性值及分类关系，数据量较大，是否继续？','更新 Shopify 标准数据').then(function(yes){
            if(!yes)return; b.option({disabled:true,text:'正在更新...'}); taxonomyAttrCall('POST','/taxonomy/import').then(function(r){
                $('#attributeSummary').text('版本 '+r.version+'：属性 '+r.attributes+'，属性值 '+r.attribute_values+'，分类属性关系 '+r.category_attributes+'。');
                taxonomyAttributeGrid.refresh(); DevExpress.ui.notify('Shopify 标准属性更新成功','success',2500);
            },function(msg){DevExpress.ui.notify(String(msg),'error',5000);}).always(function(){b.option({disabled:false,text:'从 Shopify 更新全部标准数据'});});
        });
    }});
});
</script>
<style>.taxonomy-attribute-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:10px}.taxonomy-attribute-toolbar span{color:#666}</style>
{% endblock %}
