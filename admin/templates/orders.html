{% extends "page.html" %}
{% block title %}Shopify订单{% endblock %}
{% block body %}
<div class="page-pad"><div class="order-note">订单、发货和退款来自 Shopify；退款不自动入库。收到实物后使用“退货入库”确认可售与不可售数量。</div><div id="orderGrid"></div></div>
<script>
var orderGrid;
function orderCall(method,path,body){return $.ajax({url:APP.HOST+'/api/v1/orders'+path,method:method,contentType:'application/json',data:body==null?undefined:JSON.stringify(body)}).then(function(r){return r.data;},function(x){return $.Deferred().reject((x.responseJSON&&x.responseJSON.msg)||'请求失败').promise();});}
function showLines(order){orderCall('GET','/'+order.id).then(function(pack){var host=$('<div></div>').appendTo(document.body);var popup=host.dxPopup({title:'订单明细 · '+order.order_no,width:'92%',maxWidth:1050,height:'80%',showCloseButton:true,onHidden:function(){host.remove();},contentTemplate:function(el){new DxGrid($('<div></div>').appendTo(el)[0],{dataSource:pack.lines,keyExpr:'id',dxFeatures:false,height:480,columns:[{dataField:'line_type',caption:'类型',width:110,lookup:{dataSource:[{v:'normal',t:'普通'},{v:'bundle_parent',t:'组合父行'},{v:'bundle_component',t:'组合组件'}],valueExpr:'v',displayExpr:'t'}},{dataField:'sku_code',caption:'SKU',width:140},{dataField:'title',caption:'商品',minWidth:190},{dataField:'spec_name',caption:'规格',width:130},{dataField:'quantity',caption:'订购',width:70},{dataField:'reserved_quantity',caption:'占用',width:70},{dataField:'fulfilled_quantity',caption:'发货',width:70},{dataField:'refunded_quantity',caption:'退款',width:70},{dataField:'returned_sellable_quantity',caption:'可售退回',width:85},{dataField:'returned_unavailable_quantity',caption:'不可售退回',width:90},{dataField:'allocated_subtotal',caption:'成交小计',format:'#,##0.00',width:100},{dataField:'allocated_discount',caption:'折扣',format:'#,##0.00',width:90},{dataField:'allocated_tax',caption:'税费',format:'#,##0.00',width:90}]});}}).dxPopup('instance');popup.show();});}
function receiveReturn(order){orderCall('GET','/'+order.id).then(function(pack){var eligible=(pack.lines||[]).filter(function(x){return x.line_type!=='bundle_parent'&&x.fulfilled_quantity>x.returned_sellable_quantity+x.returned_unavailable_quantity;});if(!eligible.length){DevExpress.ui.notify('没有可退货入库的已发货组件','warning',2500);return;}var rows=eligible.map(function(x){return {order_line_id:x.id,sku_code:x.sku_code,title:x.title,remaining:x.fulfilled_quantity-x.returned_sellable_quantity-x.returned_unavailable_quantity,sellable_quantity:0,unavailable_quantity:0,reason:''};});var host=$('<div></div>').appendTo(document.body),grid,remark='';var popup=host.dxPopup({title:'退货入库 · '+order.order_no,width:'92%',maxWidth:900,height:'80%',showCloseButton:true,onHidden:function(){host.remove();},contentTemplate:function(el){grid=new DxGrid($('<div></div>').appendTo(el)[0],{dataSource:rows,keyExpr:'order_line_id',dxFeatures:false,height:410,editing:{mode:'cell',allowUpdating:true},columns:[{dataField:'sku_code',caption:'SKU',allowEditing:false,width:140},{dataField:'title',caption:'商品',allowEditing:false,minWidth:180},{dataField:'remaining',caption:'最多可退',allowEditing:false,width:90},{dataField:'sellable_quantity',caption:'可售数量',dataType:'number',width:110},{dataField:'unavailable_quantity',caption:'不可售数量',dataType:'number',width:120},{dataField:'reason',caption:'原因',minWidth:150}]});$('<div class="return-remark"></div>').appendTo(el).dxTextBox({placeholder:'退货/质检备注',onValueChanged:function(e){remark=e.value;}});},toolbarItems:[{toolbar:'bottom',location:'after',widget:'dxButton',options:{text:'确认入库',type:'default',onClick:function(){grid.grid.saveEditData().done(function(){var lines=grid.grid.getDataSource().items().filter(function(x){return Number(x.sellable_quantity||0)+Number(x.unavailable_quantity||0)>0;});orderCall('POST','/'+order.id+'/returns',{remark:remark,lines:lines}).then(function(){popup.hide();orderGrid.refresh();DevExpress.ui.notify('退货库存已确认','success',2200);},function(m){DevExpress.ui.notify(String(m),'error',3500);});});}}}]}).dxPopup('instance');popup.show();});}
$(function(){orderGrid=new DxGrid($('#orderGrid')[0],{dataSource:DxGrid.remoteStore('/api/v1/orders','id'),keyExpr:'id',remoteOperations:{paging:true,filtering:true,sorting:true},headerFilter:{visible:false},paging:{pageSize:30},pager:{visible:true,showPageSizeSelector:true,allowedPageSizes:[20,30,50,100],showInfo:true},columns:[{dataField:'order_no',caption:'订单号',width:140},{dataField:'store_name',caption:'店铺',width:150},{dataField:'financial_status',caption:'支付状态',width:110},{dataField:'fulfillment_status',caption:'履约状态',width:110},{dataField:'cancel_status',caption:'取消状态',width:100},{dataField:'shop_currency',caption:'币种',width:70},{dataField:'total_price',caption:'总额',format:'#,##0.00',width:100},{dataField:'total_discount',caption:'折扣',format:'#,##0.00',width:90},{dataField:'total_tax',caption:'税费',format:'#,##0.00',width:90},{dataField:'processed_at',caption:'下单时间',dataType:'datetime',width:165},{type:'buttons',caption:'操作',width:110,buttons:[{icon:'info',hint:'查看明细',onClick:function(e){showLines(e.row.data);}},{icon:'revert',hint:'退货入库',onClick:function(e){receiveReturn(e.row.data);}}]}]});});
</script>
<style>.order-note{padding:9px 12px;margin-bottom:10px;background:var(--mdm-surface-container,#fff8df);border-radius:4px}.return-remark{margin-top:12px}</style>
{% endblock %}
