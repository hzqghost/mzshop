{% extends "page.html" %}
{% block title %}品牌管理{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="brandGrid"></div>
</div>
<script src="/static/js/lib/shop.js"></script>
<script src="/static/js/lib/supplierCatalog.js"></script>
<script>
/* Logo 上传：复用商品图片上传接口，成功后写回 Logo 文本框（弹窗保存时随表单一并提交） */
var logoFileInput = null;
function isLogoUrl(url) {
    return !!url && (String(url).indexOf('/static/') === 0 || /^https?:\/\//i.test(url));
}
function logoEditor(e) {
    return DevExpress.ui.dxTextBox.getInstance($(e.editorElement).get(0));
}
function uploadLogo(editor, file) {
    if (!file) { return; }
    if (file.size > 5 * 1024 * 1024) { DevExpress.ui.notify('图片不能超过 5MB', 'error', 2500); return; }
    var $preview = $(editor.element()).prev('.brand-logo').find('.brand-logo-preview');
    var fd = new FormData();
    fd.append('file', file);
    $preview.addClass('uploading');
    $.ajax({ url: APP.HOST + '/api/v1/shop/upload', method: 'POST', data: fd, processData: false, contentType: false })
        .then(function (res) {
            if (res.code !== 0) { return $.Deferred().reject(res.msg).promise(); }
            editor.option('value', res.data.url);
            DevExpress.ui.notify('Logo 已上传，保存后生效', 'success', 1500);
        }, function (xhr) {
            if (xhr.status === 401) { (window.top || window).location.href = APP.HOST + '/login'; }
            return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '上传失败').promise();
        })
        .fail(function (msg) { apiError(msg); })
        .always(function () { $preview.removeClass('uploading'); });
}
function pickLogo(editor) {
    if (!logoFileInput) {
        logoFileInput = $('<input type="file" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none">').appendTo(document.body);
    }
    logoFileInput.off('change').on('change', function () {
        var f = this.files && this.files[0];
        this.value = '';
        uploadLogo(editor, f);
    });
    logoFileInput.trigger('click');
}
function mountLogoEditor(e) {
    var editor = logoEditor(e);
    if (!editor) { return; }
    var $el = $(e.editorElement);
    var $head = $('<div class="brand-logo"></div>');
    var $preview = $('<div class="brand-logo-preview" title="点击或拖入图片上传"></div>').appendTo($head);
    var $img = $('<img alt="">').appendTo($preview);
    $('<span class="brand-logo-empty">点击上传<br>或拖到这里</span>').appendTo($preview);
    var $side = $('<div class="brand-logo-side"></div>').appendTo($head);
    var $actions = $('<div class="brand-logo-actions"></div>').appendTo($side);
    var $upload = $('<div></div>').appendTo($actions);
    var $remove = $('<div></div>').appendTo($actions);
    $('<div class="brand-logo-hint"></div>').text('jpg、png、gif、webp，不超过 5MB。也可以在下方粘贴图片地址。').appendTo($side);
    $el.before($head);
    function paint(url) {
        var ok = isLogoUrl(url);
        $preview.toggleClass('has-image', ok);
        $img.attr('src', ok ? url : '');
        $remove.dxButton('instance').option('disabled', !url);
    }
    $upload.dxButton({
        text: '上传图片', icon: 'upload', type: 'default', stylingMode: 'contained',
        onClick: function () { pickLogo(editor); }
    });
    $remove.dxButton({
        text: '移除', stylingMode: 'outlined', disabled: !e.value,
        onClick: function () { editor.option('value', ''); }
    });
    $preview.on('click', function () { pickLogo(editor); });
    $preview.on('dragover dragenter', function (ev) { ev.preventDefault(); $preview.addClass('drag'); });
    $preview.on('dragleave dragend', function () { $preview.removeClass('drag'); });
    $preview.on('drop', function (ev) {
        ev.preventDefault();
        $preview.removeClass('drag');
        var files = ev.originalEvent.dataTransfer && ev.originalEvent.dataTransfer.files;
        uploadLogo(editor, files && files[0]);
    });
    editor.on('valueChanged', function (ev) { paint(ev.value); });
    paint(e.value || '');
}

$(function () {
    Shop.ready.then(function () {
        var grid = new DxGrid($('#brandGrid')[0], {
            dataSource: DxGrid.restStore('/api/v1/brands', 'id'),
            keyExpr: 'id',
            // 拖动排序：手柄列拖动，成功后按新顺序刷新（sort_order 服务端重排）
            rowReorder: function (info) {
                return apiPost('/api/v1/brands/move', { id: info.key, target_id: info.targetKey, after: info.after });
            },
            editing: {
                mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
                texts: {
                    addRow: '新增品牌', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                    confirmDeleteMessage: '确定删除该品牌吗？已被商品或目录条目使用的品牌不能删除'
                },
                popup: { title: '品牌', width: 640, height: 'auto', showTitle: true, showCloseButton: true, hideOnOutsideClick: false },
                form: {
                    colCount: 1, labelLocation: 'top',
                    items: ['name'].concat(
                        Shop.langs.map(function (l) {
                            return { dataField: 'i18n.' + l.code + '.name', label: { text: '品牌名称 (' + l.code + ')' } };
                        }),
                        [
                            {
                                dataField: 'logo_url', label: { text: 'Logo' }, editorType: 'dxTextBox',
                                editorOptions: { placeholder: '粘贴图片地址，或使用上方的上传' }
                            },
                            {
                                dataField: 'website', label: { text: '官网' },
                                editorOptions: { placeholder: 'https://' }
                            },
                            {
                                dataField: 'remark', label: { text: '备注' }, editorType: 'dxTextArea',
                                editorOptions: { height: 72, placeholder: '选填' }
                            },
                            'sort_order', 'status'
                        ]
                    )
                }
            },
            onInitNewRow: function (e) {
                e.data.status = true;
                e.data.logo_url = '';
                e.data.i18n = Shop.blankI18n(['name']);
                e.component.option('editing.popup.title', '新增品牌');
            },
            onEditingStart: function (e) {
                e.component.option('editing.popup.title', e.data && e.data.id ? '编辑品牌' : '新增品牌');
            },
            onRowDblClick: function (e) {
                if (e.rowType === 'data') { e.component.editRow(e.rowIndex); }
            },
            onEditorPrepared: function (e) {
                if (e.parentType === 'dataRow' && e.dataField === 'logo_url') { mountLogoEditor(e); }
            },
            onToolbarPreparing: function (e) {
                e.toolbarOptions.items.forEach(function (item) {
                    if (item.name === 'addRowButton') {
                        item.showText = 'always';
                        item.location = 'before';
                        item.options = $.extend(item.options, { type: 'default', stylingMode: 'contained' });
                    }
                });
            },
            onRowInserted: function () { DevExpress.ui.notify('品牌已新增', 'success', 1800); SUP.notifyChanged('brand'); },
            onRowUpdated: function () { DevExpress.ui.notify('品牌已保存', 'success', 1800); SUP.notifyChanged('brand'); },
            onRowRemoved: function () { DevExpress.ui.notify('品牌已删除', 'success', 1800); SUP.notifyChanged('brand'); },
            columns: Shop.withLang([
                { dataField: 'name', caption: '品牌名称', minWidth: 150, validationRules: [{ type: 'required', message: '请输入品牌名称' }] },
                {
                    dataField: 'logo_url', caption: 'Logo', width: 84, allowFiltering: false, allowSorting: false, alignment: 'center',
                    cellTemplate: function (el, o) {
                        var $box = $('<div class="brand-logo-cell"></div>').appendTo(el);
                        if (isLogoUrl(o.value)) { $('<img alt="">').attr('src', o.value).appendTo($box); }
                        else { $box.addClass('empty').text('无'); }
                    }
                },
                {
                    dataField: 'website', caption: '官网', width: 180, allowFiltering: false, allowSorting: false,
                    editorOptions: { placeholder: 'https://' },
                    validationRules: [{
                        type: 'custom', message: '官网地址需以 http:// 或 https:// 开头',
                        validationCallback: function (o) {
                            var v = String(o.value || '').trim();
                            return !v || /^https?:\/\//i.test(v);
                        }
                    }],
                    cellTemplate: function (el, o) {
                        if (!o.value) { return; }
                        var text = String(o.value).replace(/^https?:\/\//i, '').replace(/\/$/, '');
                        $('<a class="cell-link" target="_blank" rel="noopener"></a>').attr({ href: o.value, title: o.value }).text(text).appendTo(el);
                    }
                },
                { dataField: 'item_count', caption: '目录条目', dataType: 'number', width: 90, allowEditing: false, formItem: { visible: false } },
                { dataField: 'goods_count', caption: '商品', dataType: 'number', width: 80, allowEditing: false, formItem: { visible: false } },
                { dataField: 'sort_order', caption: '排序', dataType: 'number', width: 80 },
                { dataField: 'status', caption: '启用', dataType: 'boolean', width: 70 },
                { dataField: 'remark', caption: '备注', visible: false, formItem: { visible: true } },
                { dataField: 'id', caption: 'ID', width: 60, allowEditing: false, formItem: { visible: false } },
                { dataField: 'updated_at', caption: '更新时间', width: 150, allowEditing: false, formItem: { visible: false } },
                { type: 'buttons', caption: '操作', width: 90, buttons: ['edit', 'delete'] }
            ], 'name', Shop.langColumns('name', '品牌名称', { validationRules: [{ type: 'stringLength', max: 100, message: '最长 100 个字符' }] }))
        });
        // 目录 Excel 导入会自动建档品牌，目录有变化时刷新使用数
        SUP.onChanged('catalog', function () { grid.refresh(); });
    });
});
</script>
<style>
.brand-logo { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 8px; }
.brand-logo-preview {
    width: 96px; height: 96px; flex: 0 0 96px; box-sizing: border-box;
    border: 1px dashed var(--mdm-input-border, #bdbdbd); border-radius: 8px;
    background: #f7f9fa; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 8px; position: relative; overflow: hidden;
}
.brand-logo-preview:hover, .brand-logo-preview.drag { border-color: var(--mdm-primary, #0C6C9E); background: var(--mdm-primary-bg, #e8f3fa); }
.brand-logo-preview.has-image { border-style: solid; background: #fff; }
.brand-logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
.brand-logo-preview.has-image img { display: block; }
.brand-logo-empty { color: var(--mdm-text-mute, #8a8a8a); font-size: 12px; line-height: 1.45; text-align: center; }
.brand-logo-preview.has-image .brand-logo-empty { display: none; }
.brand-logo-preview.uploading::after {
    content: '上传中…'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .82); color: var(--mdm-primary, #0C6C9E); font-size: 12px;
}
.brand-logo-side { flex: 1; min-width: 0; }
.brand-logo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.brand-logo-hint { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--mdm-text-mute, #8a8a8a); }
.brand-logo-cell {
    width: 40px; height: 40px; margin: 2px auto; box-sizing: border-box;
    border: 1px solid var(--mdm-border, #eee); border-radius: 6px; background: #fafafa;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.brand-logo-cell img { width: 100%; height: 100%; object-fit: contain; }
.brand-logo-cell.empty { color: #c4c4c4; font-size: 12px; }
.cell-link { color: var(--mdm-primary, #0C6C9E); display: inline-block; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
</style>
{% endblock %}
