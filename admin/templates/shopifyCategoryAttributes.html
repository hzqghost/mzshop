{% extends "page.html" %}
{% block title %}分类属性{% endblock %}
{% block body %}
<div class="page-pad">
    <div class="attribute-head">
        <div id="localCategory"></div>
        <span id="taxonomyCategoryHint">请选择 mzShop 分类</span>
    </div>
    <div id="categoryAttributeGrid"></div>
</div>
<script src="/static/js/lib/shop.js?v=20261120"></script>
<script>
var attributeGrid, categoryButton, selectedCategoryId = null, attributeItems = [];
function attrCall(method, path, body) {
    return $.ajax({url: APP.HOST + '/api/v1/shopify' + path, method: method,
        contentType:'application/json', data:body == null ? undefined : JSON.stringify(body)}).then(function(res){
        if (!res || res.code !== 0) return $.Deferred().reject((res && res.msg) || '请求失败').promise();
        return res.data;
    }, function(xhr){ return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '请求失败').promise(); });
}
function loadAttributes() {
    if (!selectedCategoryId) return;
    attrCall('GET','/category-attributes?category_id=' + selectedCategoryId).then(function(data){
        attributeItems = data.items || [];
        $('#taxonomyCategoryHint').text(data.taxonomy_category ?
            'Shopify：' + data.taxonomy_category.full_name + (data.taxonomy_category.bound_category_id !== selectedCategoryId ? '（继承上级绑定）' : '') :
            '该分类及其上级尚未绑定 Shopify 标准分类');
        attributeGrid.option('dataSource', attributeItems);
    }, function(msg){ DevExpress.ui.notify(String(msg),'error',3500); });
}
function openAttributeMap(row) {
    attrCall('GET','/category-attributes/' + row.id + '/mapping?category_id=' + selectedCategoryId).then(function(data){
        var localId = data.mapping ? data.mapping.local_attribute_id : null;
        var valueMap = $.extend({}, data.mapping ? data.mapping.value_map : {});
        var localById = {}; (data.local_attributes || []).forEach(function(a){ localById[a.id] = a; });
        var valueSource = [{id:null,name:'不映射'}].concat(data.taxonomy_values || []);
        var $host = $('<div></div>').appendTo(document.body), $valueBox;
        var popup = $host.dxPopup({title:'映射分类属性：' + row.name_zh, width:'92%', maxWidth:850, height:'82%',
            showCloseButton:true, hideOnOutsideClick:false, onHidden:function(){popup.dispose();$host.remove();},
            contentTemplate:function(content){
                $('<div class="map-field-label">mzShop 属性</div>').appendTo(content);
                var select = $('<div></div>').appendTo(content).dxSelectBox({dataSource:data.local_attributes,
                    valueExpr:'id', displayExpr:'name', value:localId, searchEnabled:true, placeholder:'选择适用于该分类的本地属性',
                    onValueChanged:function(e){localId=e.value; renderValues();}}).dxSelectBox('instance');
                $('<div class="map-value-title">属性值映射</div>').appendTo(content);
                $valueBox = $('<div class="map-values"></div>').appendTo(content);
                function renderValues(){
                    $valueBox.empty(); var local = localById[localId];
                    if (!local) { $valueBox.text('选择本地属性后配置选项映射。'); return; }
                    if (['select','multiselect'].indexOf(local.input_type) < 0 || !local.options.length) {
                        $valueBox.text('该本地属性没有可映射的固定选项；推送时不会生成此 Shopify 类别属性值。'); return;
                    }
                    local.options.forEach(function(option){
                        var $row=$('<div class="map-value-row"><div class="local-option"></div><div class="arrow">→</div><div class="target-option"></div></div>').appendTo($valueBox);
                        $row.find('.local-option').text(option);
                        var current = valueMap[option] || []; if (!Array.isArray(current)) current = [current];
                        $('<div></div>').appendTo($row.find('.target-option')).dxTagBox({dataSource:valueSource.slice(1),
                            valueExpr:'id', displayExpr:'name', value:current, searchEnabled:true,
                            placeholder:'可选择多个官方值', showSelectionControls:true, applyValueMode:'useButtons',
                            onValueChanged:function(e){ if(e.value && e.value.length) valueMap[option]=e.value; else delete valueMap[option]; }});
                    });
                }
                renderValues();
                $('<div class="map-actions"></div>').appendTo(content).append($('<div></div>').dxButton({text:'保存映射',type:'default',onClick:function(){
                    if(!localId){DevExpress.ui.notify('请选择 mzShop 属性','warning',2200);return;}
                    attrCall('PUT','/category-attributes/' + row.id + '/mapping',{category_id:selectedCategoryId,local_attribute_id:localId,value_map:valueMap}).then(function(){
                        DevExpress.ui.notify('属性映射已保存','success',1800);popup.hide();loadAttributes();
                    },function(msg){DevExpress.ui.notify(String(msg),'error',3500);});
                }}));
            }}).dxPopup('instance'); popup.show();
    });
}
$(function(){
    categoryButton = $('#localCategory').dxButton({text:'选择 mzShop 分类',icon:'hierarchy',width:420,stylingMode:'outlined',
        onClick:function(){Shop.openCategoryPicker({value:selectedCategoryId,title:'选择 mzShop 分类（单选）',onSelected:function(row){
            selectedCategoryId=row.id; categoryButton.option('text',row.full_name || row.name); loadAttributes();
        }});}}).dxButton('instance');
    attributeGrid = new DxGrid($('#categoryAttributeGrid')[0],{dataSource:attributeItems,keyExpr:'id',businessToolbar:true,
        columns:[
            {dataField:'name_zh',caption:'Shopify 属性',minWidth:180,fixed:true,fixedPosition:'left'},
            {dataField:'name_en',caption:'英文',minWidth:180},
            {dataField:'handle',caption:'标准字段 Key',width:190},
            {dataField:'description_zh',caption:'说明',minWidth:260},
            {dataField:'value_count',caption:'官方值数',dataType:'number',width:90},
            {dataField:'is_extended',caption:'扩展属性',dataType:'boolean',width:90},
            {dataField:'local_attribute_name',caption:'mzShop 属性',width:160,fixed:true,fixedPosition:'right',
             cellTemplate:function(el,o){$('<span></span>').toggleClass('not-mapped',!o.value).text(o.value || '未映射').appendTo(el);}},
            {dataField:'mapped_value_count',caption:'已映射值',dataType:'number',width:90},
            {type:'buttons',caption:'操作',width:115,buttons:[
                {icon:'link',hint:'映射 / 修改',onClick:function(e){openAttributeMap(e.row.data);}},
                {icon:'remove',hint:'解绑',visible:function(e){return !!e.row.data.local_attribute_id;},onClick:function(e){
                    var row=e.row.data; DevExpress.ui.dialog.confirm('确定解除“'+row.name_zh+'”的属性映射吗？','解除属性映射').then(function(yes){if(!yes)return;
                        attrCall('DELETE','/category-attributes/'+row.id+'/mapping?category_id='+selectedCategoryId).then(function(){loadAttributes();});});
                }}]}
        ]});
});
</script>
<style>
.attribute-head{display:flex;align-items:center;gap:16px;margin-bottom:10px}.attribute-head>span{color:#666}
.not-mapped{color:#9a6b00}.map-field-label,.map-value-title{font-weight:600;margin:12px 0 8px}.map-value-title{margin-top:20px}
.map-values{max-height:390px;overflow:auto}.map-value-row{display:grid;grid-template-columns:1fr 40px 1.5fr;align-items:center;gap:8px;margin:7px 0}
.arrow{text-align:center;color:#888}.map-actions{display:flex;justify-content:flex-end;margin-top:18px}
</style>
{% endblock %}
