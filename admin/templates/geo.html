{% extends "page.html" %}
{% block title %}国家地区{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="geoTree"></div>
</div>
<script>
/* 全球 → 洲 → 国家。树用 dxTreeList，外观与其它表格对齐 */
$(function () {
    function parentRows(res) {
        var rows = (res.data || []).map(function (r) {
            return { id: r.id, label: (r.code ? r.code + '-' : '') + r.name_zh };
        });
        rows.unshift({ id: 0, label: '（顶级）' });
        return rows;
    }
    function parentSource() {
        // 表格 lookup 只接受 Store，不接受 DataSource
        return new DevExpress.data.CustomStore({
            key: 'id',
            loadMode: 'raw',
            load: function () {
                return $.ajax({ url: APP.HOST + '/api/v1/geo', method: 'GET' }).then(function (res) {
                    if (res.code !== 0) { return $.Deferred().reject(res.msg).promise(); }
                    return parentRows(res);
                });
            },
            byKey: function (key) {
                if (key === 0 || key === '0' || key === null || key === undefined) { return { id: 0, label: '（顶级）' }; }
                return $.ajax({ url: APP.HOST + '/api/v1/geo', method: 'GET' }).then(function (res) {
                    var found = parentRows(res).filter(function (r) { return r.id === key || r.id === Number(key); })[0];
                    return found || { id: key, label: '' };
                });
            }
        });
    }
    var tree = $('#geoTree').dxTreeList($.extend({}, DxGrid.styleOptions(), DxGrid.treeOptions(), {
        dataSource: DxGrid.restStore('/api/v1/geo', 'id'),
        keyExpr: 'id',
        parentIdExpr: 'parent_id',
        rootValue: 0,
        autoExpandAll: true,
        showBorders: true,
        columnAutoWidth: true,
        allowColumnResizing: true,
        searchPanel: { visible: true, width: 240, placeholder: '搜索国家地区...' },
        height: function () { return DxGrid.autoHeight('#geoTree'); },
        paging: { enabled: false },
        pager: { visible: false },
        noDataText: '暂无国家地区',
        editing: {
            mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
            texts: {
                addRow: '新增', addRowToNode: '新增子级', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteTitle: '删除国家地区',
                confirmDeleteMessage: '确定删除吗？还有下级、或已被区域勾选时不能删除'
            },
            popup: { title: '国家地区', width: '90%', maxWidth: 460, height: '80%', showTitle: true },
            form: { colCount: 1, labelLocation: 'left', items: ['parent_id', 'code', 'name_zh', 'name_en', 'is_leaf', 'sort_order'] }
        },
        onInitNewRow: function (e) {
            if (e.data.parent_id === undefined) { e.data.parent_id = 0; }
            e.data.is_leaf = true;
            e.data.sort_order = 0;
        },
        onRowDblClick: function (e) { if (e.rowType === 'data') { e.component.editRow(e.rowIndex); } },
        onToolbarPreparing: function (e) {
            var component = e.component;
            component._hasBusinessToolbar = true;
            component._gridKey = '/geo';
            component._stateKey = 'dxGrid:/geo';
            DxGrid._buildToolbar(component, e);
            e.toolbarOptions.items.push({
                location: 'before', widget: 'dxButton',
                options: { text: '展开全部', onClick: function () { component.option('autoExpandAll', true); component.refresh(); } }
            }, {
                location: 'before', widget: 'dxButton',
                options: { text: '收起全部', onClick: function () { component.option('autoExpandAll', false); component.option('expandedRowKeys', []); component.refresh(); } }
            });
            DxGrid._placeColumnChooser(e.toolbarOptions.items, component);
        },
        onRowInserted: function () { DevExpress.ui.notify('已新增', 'success', 1800); },
        onRowUpdated: function () { DevExpress.ui.notify('已保存', 'success', 1800); },
        onRowRemoved: function () { DevExpress.ui.notify('已删除', 'success', 1800); },
        columns: DxGrid.prepareColumns([
            {
                dataField: 'name_zh', caption: '中文名', minWidth: 180,
                validationRules: [{ type: 'required', message: '请填写中文名' }, { type: 'stringLength', max: 50, message: '最长 50 个字符' }]
            },
            {
                dataField: 'code', caption: '编码', width: 110,
                validationRules: [
                    { type: 'required', message: '请填写编码' },
                    { type: 'pattern', pattern: /^[A-Za-z0-9][A-Za-z0-9_-]{0,9}$/, message: '1~10 位字母、数字、下划线或连字符' }
                ]
            },
            {
                dataField: 'name_en', caption: '英文名', minWidth: 180,
                validationRules: [{ type: 'required', message: '请填写英文名' }, { type: 'stringLength', max: 80, message: '最长 80 个字符' }]
            },
            {
                dataField: 'parent_id', caption: '上级', visible: false,
                formItem: { label: { text: '父ID' } },
                lookup: { dataSource: parentSource(), valueExpr: 'id', displayExpr: 'label' }
            },
            { dataField: 'is_leaf', caption: '子节点', dataType: 'boolean', width: 90, formItem: { label: { text: '是否为子节点' } } },
            { dataField: 'sort_order', caption: '排序', dataType: 'number', width: 80, sortOrder: 'asc', sortIndex: 0 },
            { dataField: 'id', caption: 'ID', width: 70, allowEditing: false, formItem: { visible: false } },
            { dataField: 'created_at', caption: '创建时间', width: 160, allowEditing: false, formItem: { visible: false } },
            { type: 'buttons', width: 110, buttons: ['add', 'edit', 'delete'] }
        ])
    })).dxTreeList('instance');
    DxGrid.enableAutoHeight(tree);
    DxGrid._initBusinessToolbar(tree, true);
    $(window).on('resize', function () { DxGrid.syncAutoHeight(tree); });
});
</script>
{% endblock %}
