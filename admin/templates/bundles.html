{% extends "page.html" %}
{% block title %}组合装{% endblock %}
{% block body %}
<div class="page-pad"><div class="bundle-note">配方启用后不可修改；替换组件请新建版本。组合售价和商品资料在父 SKU 所属商品中维护，组合可用库存由组件实时计算。</div><div id="bundleGrid"></div></div>
<script>
var bundleGrid;
function bundleCall(method, path, body) {
    return $.ajax({url: APP.HOST + '/api/v1/bundles' + path, method: method, contentType: 'application/json',
        data: body == null ? undefined : JSON.stringify(body)}).then(function (r) { return r.data; }, function (x) {
        return $.Deferred().reject((x.responseJSON && x.responseJSON.msg) || '请求失败').promise(); });
}
function openBundleGoods(row) {
    openAdminTab('/goodsEdit?id=' + row.goods_id, row.goods_name || row.parent_sku_code);
}
function skuLinkCell(el, row) {
    $('<a href="javascript:;" class="sku-link"></a>').text(row.sku_code || '').on('click', function(e){
        e.preventDefault(); e.stopPropagation(); openAdminTab('/goodsEdit?id=' + row.goods_id, row.goods_name || row.sku_code);
    }).appendTo(el);
}
function bundleSkuRows(row) {
    var rows=[{row_key:'parent-'+row.parent_sku_id,sku_id:row.parent_sku_id,sku_code:row.parent_sku_code,goods_id:row.goods_id,
        goods_name:row.goods_name,spec_name:row.parent_spec_name,sku_type:'bundle',quantity:null,cost_price:row.parent_cost_price,status:row.parent_status}];
    (row.components||[]).forEach(function(x){rows.push($.extend({row_key:'component-'+x.component_sku_id,sku_type:'normal'},x));});
    return rows;
}
function renderBundleSkus(container, row) {
    new DxGrid($('<div class="bundle-sku-grid"></div>').appendTo(container)[0], {dataSource:bundleSkuRows(row),keyExpr:'row_key',dxFeatures:false,
        height:'auto',autoHeight:false,filterRow:{visible:false},headerFilter:{visible:false},paging:{enabled:false},columns:[
            {dataField:'sku_type',caption:'类型',width:105,lookup:{dataSource:[{v:'bundle',t:'组合父 SKU'},{v:'normal',t:'组件 SKU'}],valueExpr:'v',displayExpr:'t'}},
            {dataField:'sku_code',caption:'SKU编码',width:170,cellTemplate:function(el,o){skuLinkCell(el,o.data);}},
            {dataField:'goods_name',caption:'商品名称',minWidth:220},{dataField:'spec_name',caption:'规格',width:160},
            {dataField:'quantity',caption:'每套数量',dataType:'number',width:100,calculateCellValue:function(r){return r.sku_type==='bundle'?null:r.quantity;}},
            {dataField:'cost_price',caption:'拿货价',dataType:'number',format:'#,##0.00',width:100},{dataField:'status',caption:'启用',dataType:'boolean',width:75}
        ]});
}
function editBundle(row) {
    $.when(bundleCall('GET', '/parent-options'), bundleCall('GET', '/component-options?take=100')).then(function (parents, options) {
        var data = row ? $.extend(true, {}, row) : {parent_sku_id: null, remark: '', components: []};
        var host = $('<div></div>').appendTo(document.body), form, componentGrid;
        function componentOptions() {
            return options.filter(function (item) { return item.id !== data.parent_sku_id; });
        }
        var popup = host.dxPopup({title: row ? '编辑组合草稿' : '新建组合版本', width: '90%', maxWidth: 900, height: '85%',
            showCloseButton: true, onHidden: function () { host.remove(); }, contentTemplate: function (el) {
                form = $('<div></div>').appendTo(el).dxForm({formData: data, labelLocation: 'top', colCount: 2, items: [
                    {dataField: 'parent_sku_id', label: {text: '组合父 SKU'}, editorType: 'dxSelectBox', colSpan: 1,
                     editorOptions: {dataSource: parents, valueExpr: 'id', displayExpr: 'text', searchEnabled: true, readOnly: !!row,
                         onValueChanged: function (e) {
                             data.parent_sku_id = e.value;
                             var selected = parents.filter(function(x){return x.id===e.value;})[0];
                             if (selected && !selected.is_dedicated && !row) { DevExpress.ui.notify('该 SKU 与其它规格共用商品名称、图片和描述；独立组合商品建议选择带“独立商品”标记的 SKU','warning',4500); }
                             if (componentGrid) { componentGrid.columnOption('component_sku_id', 'lookup.dataSource', componentOptions()); }
                         }}},
                    {dataField: 'remark', label: {text: '版本说明'}, colSpan: 1}
                ]}).dxForm('instance');
                $('<div class="component-title">组件明细</div>').appendTo(el);
                componentGrid = new DxGrid($('<div></div>').appendTo(el)[0], {dataSource: data.components, keyExpr: 'component_sku_id',
                    dxFeatures: false, height: 330, editing: {mode: 'row', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true},
                    columns: [
                        {dataField: 'component_sku_id', caption: '组件 SKU', lookup: {dataSource: componentOptions(), valueExpr: 'id', displayExpr: 'text'},
                         validationRules: [{type:'required'}]},
                        {dataField: 'quantity', caption: '每套数量', dataType: 'number', width: 120,
                         validationRules: [{type:'range', min:1, max:100000}]},
                        {type:'buttons', caption:'操作', buttons:['edit','delete']}
                    ]});
            }, toolbarItems: [
                {toolbar:'bottom', location:'after', widget:'dxButton', options:{text:'取消', onClick:function(){popup.hide();}}},
                {toolbar:'bottom', location:'after', widget:'dxButton', options:{text:'保存草稿', type:'default', onClick:function(){
                    componentGrid.saveEditData().done(function () {
                        if (componentGrid.hasEditData()) { return; }
                        var payload = form.option('formData'); payload.components = componentGrid.getDataSource().items();
                        bundleCall(row ? 'PUT' : 'POST', row ? '/' + row.id : '', payload).then(function(){
                            DevExpress.ui.notify('组合草稿已保存','success',2000); popup.hide(); bundleGrid.refresh();
                        }, function(msg){DevExpress.ui.notify(String(msg),'error',3500);});
                    });
                }}}
            ]}).dxPopup('instance'); popup.show();
    });
}
$(function(){
    bundleGrid = new DxGrid($('#bundleGrid')[0], {dataSource: DxGrid.restStore('/api/v1/bundles','id'), keyExpr:'id',
        masterDetail:{enabled:true,template:function(container,o){renderBundleSkus(container,o.data);}},
        onToolbarPreparing:function(e){e.toolbarOptions.items.unshift({location:'before',widget:'dxButton',options:{text:'新建组合版本',icon:'add',type:'default',onClick:function(){editBundle(null);}}});},
        columns:[
            {dataField:'parent_sku_code',caption:'父 SKU',width:150,cellTemplate:function(el,o){skuLinkCell(el,{sku_code:o.data.parent_sku_code,goods_id:o.data.goods_id,goods_name:o.data.goods_name});}},{dataField:'goods_name',caption:'商品名称',minWidth:200},
            {dataField:'version_no',caption:'版本',width:80},{dataField:'status',caption:'状态',width:100,
             lookup:{dataSource:[{v:'draft',t:'草稿'},{v:'published',t:'已启用'},{v:'disabled',t:'已停用'}],valueExpr:'v',displayExpr:'t'}},
            {dataField:'price_text',caption:'组合售价',minWidth:190,calculateCellValue:function(r){return r.price_text||'未定价';},cellTemplate:function(el,o){$('<span></span>').text(o.value).toggleClass('bundle-missing',!o.data.price_text).appendTo(el);}},
            {dataField:'availability_text',caption:'可用库存',minWidth:160,calculateCellValue:function(r){if(r.status==='disabled'){return '—';}return r.availability_text||'未设置库存地点';}},
            {dataField:'remark',caption:'版本说明',minWidth:160},{dataField:'published_at',caption:'启用时间',dataType:'datetime',width:165},
            {type:'buttons',caption:'操作',width:160,buttons:[
                {icon:'info',hint:'编辑商品详情与组合售价',onClick:function(e){openBundleGoods(e.row.data);}},
                {icon:'edit',hint:'编辑草稿',visible:function(e){return e.row.data.status==='draft';},onClick:function(e){editBundle(e.row.data);}},
                {icon:'check',hint:'启用配方',visible:function(e){return e.row.data.status==='draft';},onClick:function(e){
                    DevExpress.ui.dialog.confirm('启用后不可修改，确定启用该配方？','启用配方').then(function(yes){if(yes){bundleCall('POST','/'+e.row.data.id+'/publish').then(function(){bundleGrid.refresh();DevExpress.ui.notify('配方已启用','success',1800);});}});}},
                {name:'delete',visible:function(e){return e.row.data.status==='draft';}}
            ]}
        ], editing:{allowDeleting:true,useIcons:true}, onRowRemoving:function(e){e.cancel=bundleCall('DELETE','/'+e.data.id);}
    });
});
</script>
<style>.bundle-note{padding:9px 12px;margin-bottom:10px;background:var(--mdm-surface-container,#fff8df);border-radius:4px}.component-title{font-weight:600;margin:14px 0 8px}.bundle-missing{color:#c67a00}.bundle-sku-grid{padding:8px 12px 12px}.sku-link{color:#1684d5;text-decoration:none}.sku-link:hover{text-decoration:underline}</style>
{% endblock %}
