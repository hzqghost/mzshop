{% extends "page.html" %}
{% block title %}供应商文档{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="docGrid"></div>
</div>
<script src="/static/js/lib/shop.js?v=20261119-3"></script>
<script src="/static/js/lib/supplierCatalog.js?v=20261119-1"></script>
<script>
$(function () {
    var ACCEPT = '.jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip';
    var fileInput = null;
    var sessionUploads = [];
    var uploading = false;

    function formatSize(n) {
        n = Number(n) || 0;
        if (n < 1024) { return n + ' B'; }
        if (n < 1024 * 1024) { return (n / 1024).toFixed(n < 10 * 1024 ? 1 : 0) + ' KB'; }
        return (n / 1024 / 1024).toFixed(1) + ' MB';
    }
    function discardExcept(keep) {
        var urls = sessionUploads.filter(function (u) { return u && u !== keep; });
        sessionUploads = [];
        if (urls.length) { SUP.call('POST', '/uploads/discard', { urls: urls }); }
    }
    function pickFile(onFile) {
        if (!fileInput) {
            fileInput = $('<input type="file" style="display:none">').attr('accept', ACCEPT).appendTo(document.body);
        }
        fileInput.off('change').on('change', function () {
            var f = this.files && this.files[0];
            this.value = '';
            if (f) { onFile(f); }
        });
        fileInput.trigger('click');
    }
    function patchEditing(patch) {
        var grid = $('#docGrid').dxGrid('instance');
        var key = grid.option('editing.editRowKey');
        var changes = (grid.option('editing.changes') || []).slice();
        var hit = false;
        changes.forEach(function (c) {
            if (c.key === key) { c.data = $.extend({}, c.data, patch); hit = true; }
        });
        if (!hit) { changes.push({ type: key == null ? 'insert' : 'update', key: key, data: $.extend({}, patch) }); }
        grid.option('editing.changes', changes);
    }
    function sendFile(file, form) {
        if (file.size > 20 * 1024 * 1024) { DevExpress.ui.notify('文件不能超过 20MB', 'error', 2500); return; }
        var fd = new FormData();
        fd.append('file', file);
        uploading = true;
        SUP.upload('/uploads', fd).then(function (res) {
            var patch = { file_url: res.url, file_name: res.name || file.name, file_size: res.size || file.size };
            sessionUploads.push(res.url);
            form.updateData(patch);
            patchEditing(patch);
            DevExpress.ui.notify('文件已上传，保存后生效', 'success', 1500);
        }).fail(function (msg) {
            DevExpress.ui.notify(msg || '上传失败', 'error', 2500);
        }).always(function () { uploading = false; });
    }
    function fileTemplate(data, element) {
        var form = data.component;
        var $box = $('<div class="doc-file"></div>').appendTo(element);
        var $name = $('<a class="doc-file-name" target="_blank" rel="noopener"></a>').appendTo($box);
        var $btn = $('<div></div>').appendTo($box);
        function paint() {
            var row = form.option('formData') || {};
            var url = row.file_url || '';
            var label = row.file_name || (url ? '已上传文件' : '尚未上传');
            $name.text(label + (row.file_size ? ' · ' + formatSize(row.file_size) : ''));
            if (url) { $name.attr('href', url).removeClass('is-empty'); }
            else { $name.removeAttr('href').addClass('is-empty'); }
        }
        $btn.dxButton({
            text: '上传文件', icon: 'upload', type: 'default', stylingMode: 'contained',
            onClick: function () {
                pickFile(function (file) { sendFile(file, form); });
            }
        });
        form.on('fieldDataChanged', function (e) {
            if (e.dataField === 'file_url' || e.dataField === 'file_name' || e.dataField === 'file_size') { paint(); }
        });
        paint();
    }

    var grid = new DxGrid($('#docGrid')[0], {
        dataSource: DxGrid.restStore('/api/v1/supplier-catalog/documents', 'id'),
        keyExpr: 'id',
        businessToolbar: true,
        editing: {
            mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
            texts: {
                addRow: '上传文档', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteMessage: '确定删除该文档吗？文件会一并删除'
            },
            popup: { title: '供应商文档', width: '90%', maxWidth: 640, height: '80%', showTitle: true, showCloseButton: true, hideOnOutsideClick: false },
            form: {
                colCount: 1, labelLocation: 'left',
                items: [
                    {
                        dataField: 'supplier_id', label: { text: '供应商' }, editorType: 'dxLookup',
                        validationRules: [{ type: 'required', message: '请选择供应商' }],
                        editorOptions: Shop.dictLookup({ dataSource: SUP.supplierSource(), displayExpr: 'name', placeholder: '请选择供应商' })
                    },
                    {
                        dataField: 'doc_type', label: { text: '文档类型' }, editorType: 'dxSelectBox',
                        validationRules: [{ type: 'required', message: '请选择文档类型' }],
                        editorOptions: { dataSource: SUP.DOC_TYPES, valueExpr: 'value', displayExpr: 'text', placeholder: '请选择类型' }
                    },
                    {
                        dataField: 'title', label: { text: '标题' },
                        validationRules: [
                            { type: 'required', message: '请输入标题' },
                            { type: 'stringLength', max: 200, message: '最长 200 个字符' }
                        ]
                    },
                    { dataField: 'file_url', label: { text: '文件' }, template: fileTemplate },
                    { dataField: 'file_name', visible: false },
                    { dataField: 'file_size', visible: false },
                    {
                        dataField: 'remark', label: { text: '备注' }, editorType: 'dxTextArea',
                        editorOptions: { height: 72, maxLength: 500 }
                    }
                ]
            }
        },
        onInitNewRow: function (e) {
            sessionUploads = [];
            e.data.doc_type = 'other';
        },
        onEditingStart: function () { sessionUploads = []; },
        onEditCanceled: function () { discardExcept(null); },
        onRowValidating: function (e) {
            if (uploading) { e.isValid = false; e.errorText = '文件还在上传，请稍候'; return; }
            var row = $.extend({}, e.oldData, e.newData);
            if (!row.file_url) { e.isValid = false; e.errorText = '请上传文件'; }
        },
        onRowInserted: function (e) {
            discardExcept(e.data && e.data.file_url);
            DevExpress.ui.notify('文档已上传', 'success', 1800);
            SUP.notifyChanged('document');
        },
        onRowUpdated: function (e) {
            discardExcept(e.data && e.data.file_url);
            DevExpress.ui.notify('文档已保存', 'success', 1800);
            SUP.notifyChanged('document');
        },
        onRowRemoved: function () {
            DevExpress.ui.notify('文档已删除', 'success', 1800);
            SUP.notifyChanged('document');
        },
        columns: [
            {
                dataField: 'supplier_id', caption: '供应商', width: 160,
                lookup: { dataSource: SUP.supplierSource(), valueExpr: 'id', displayExpr: 'name' }
            },
            {
                dataField: 'doc_type', caption: '类型', width: 110,
                lookup: { dataSource: SUP.DOC_TYPES, valueExpr: 'value', displayExpr: 'text' }
            },
            { dataField: 'title', caption: '标题', minWidth: 180 },
            {
                dataField: 'file_name', caption: '文件', minWidth: 180,
                allowEditing: false, formItem: { visible: false },
                cellTemplate: function (el, o) {
                    var url = o.data.file_url;
                    if (!url) { return; }
                    $('<a class="cell-link" target="_blank" rel="noopener"></a>')
                        .attr({ href: url, title: o.value || url })
                        .text(o.value || '下载')
                        .appendTo(el);
                }
            },
            {
                dataField: 'file_size', caption: '大小', width: 90, dataType: 'number',
                allowEditing: false, formItem: { visible: false },
                customizeText: function (c) { return formatSize(c.value); }
            },
            { dataField: 'remark', caption: '备注', width: 200 },
            { dataField: 'id', caption: 'ID', width: 60, allowEditing: false, formItem: { visible: false } },
            { dataField: 'created_at', caption: '上传时间', width: 150, allowEditing: false, formItem: { visible: false } },
            { dataField: 'updated_at', caption: '更新时间', width: 150, allowEditing: false, formItem: { visible: false } },
            {
                type: 'buttons', caption: '操作', width: 110,
                buttons: [
                    { icon: 'download', hint: '下载', onClick: function (e) { window.open(e.row.data.file_url, '_blank'); } },
                    'edit', 'delete'
                ]
            }
        ]
    });
    SUP.onChanged('supplier', function () { grid.refresh(); });
});
</script>
<style>
.cell-link, .doc-file-name { color: var(--mdm-primary, #0C6C9E); }
.doc-file { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.doc-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-file-name.is-empty { color: #888; pointer-events: none; }
</style>
{% endblock %}
