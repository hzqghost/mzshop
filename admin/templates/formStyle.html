{% extends "page.html" %}
{% block title %}Form 配置{% endblock %}
{% block body %}
<div class="cfg-page">
    <div class="cfg-card">
        <div class="cfg-title">方案</div>
        <div class="cfg-tip">选一个常用方案作为起点，再按需微调；调整任何一项后方案显示为「自定义」</div>
        <div id="fspPresets" class="cfg-presets"></div>
    </div>

    <div class="cfg-card">
        <div class="cfg-title">样式</div>
        <div class="cfg-tip">选「跟随默认」的项不会覆盖页面自己的表单外观，选了具体值则全站表单统一按它显示</div>
        <div id="fspForm"></div>
    </div>

    <div class="cfg-card">
        <div class="cfg-title">预览</div>
        <div class="cfg-tip">保存后，已打开的页面刷新才会生效，新打开的页面立即生效；设置只对当前登录用户有效</div>
        <div class="cfg-switch"><div id="fspIndustrialSwitch"></div><span>按紧凑表单预览</span></div>
        <div id="fspPreview"><div id="fspPreviewForm"></div></div>
    </div>

    <div id="fspActions" class="cfg-actions"></div>
</div>

<script>
$(function () {
    var presets = {{ presets|tojson }};
    var style = {{ style|tojson }};
    var PRESET_NAMES = {
        'default': ['默认', '全部跟随默认，不覆盖任何页面的表单外观'],
        'compact': ['紧凑', '标签靠右、行距小、输入框矮，适合录入密集的表单'],
        'comfortable': ['宽松', '标签靠左、行距大、输入框高、圆角大，阅读更轻松'],
        'clear': ['清晰', '标签深色加粗，输入框边框加深，层次更分明']
    };
    var LABELS = { labelColor: '标签文字色', inputBorder: '输入框边框色', inputFocus: '聚焦边框色', inputBg: '输入框底色',
        readonlyBg: '只读底色', valueColor: '录入值文字色', panelBg: '紧凑表单底色' };

    var FIELDS = ['labelAlign', 'labelColor', 'labelWeight', 'fontSize', 'rowGap', 'density', 'radius',
        'inputBorder', 'inputFocus', 'inputBg', 'readonlyBg', 'valueColor', 'panelBg'];
    var COLOR_FIELDS = ['labelColor', 'valueColor', 'inputBorder', 'inputFocus', 'inputBg', 'readonlyBg', 'panelBg'];
    var COLOR_VARS = { labelColor: ['--fs-label-color', 'fs-label-color'], valueColor: ['--fs-value-color', 'fs-value-color'],
        inputBorder: ['--fs-input-border', 'fs-border'], inputFocus: ['--fs-input-focus', 'fs-focus'], inputBg: ['--fs-input-bg', 'fs-bg'],
        readonlyBg: ['--fs-readonly-bg', 'fs-readonly-bg'], panelBg: ['--fs-panel-bg', 'fs-panel-bg'] };
    var GAP = { compact: '2px', normal: '5px', loose: '10px' };
    var PAD = { compact: '1px', normal: '5px', loose: '9px' };
    var RADIUS = { none: '0', small: '4px', large: '8px' };
    var VARS = ['--fs-font-size', '--fs-gap', '--fs-pad-y', '--fs-radius'].concat(COLOR_FIELDS.map(function (k) { return COLOR_VARS[k][0]; }));
    var CLASSES = ['fs-label-left', 'fs-label-right', 'fs-weight-normal', 'fs-weight-bold', 'fs-font', 'fs-gap', 'fs-pad', 'fs-compact', 'fs-radius']
        .concat(COLOR_FIELDS.map(function (k) { return COLOR_VARS[k][1]; }));

    // 配置页自己不吃已保存的样式：清掉 body 上的 fs 变量和 class，预览容器按表单值重新设，改了表单立刻看到效果
    CLASSES.forEach(function (c) { document.body.classList.remove(c); });
    VARS.forEach(function (v) { document.body.style.removeProperty(v); });
    var form, preview, applying = false;

    function formValues() {
        var data = form.option('formData');
        var values = {};
        FIELDS.forEach(function (k) { values[k] = data[k]; });
        COLOR_FIELDS.forEach(function (k) { values[k] = values[k] || ''; });
        values.preset = currentPreset(values);
        return values;
    }

    // 与哪个预设完全一致就算哪个，否则是自定义
    function currentPreset(values) {
        var found = 'custom';
        Object.keys(presets).forEach(function (key) {
            if (FIELDS.every(function (k) { return presets[key][k] === values[k]; })) { found = key; }
        });
        return found;
    }

    function renderPresets() {
        var active = currentPreset(formValues());
        var $box = $('#fspPresets').empty();
        Object.keys(PRESET_NAMES).forEach(function (key) {
            $('<div class="cfg-preset">').toggleClass('active', key === active)
                .append($('<div class="cfg-preset-name">').text(PRESET_NAMES[key][0]))
                .append($('<div class="cfg-preset-tip">').text(PRESET_NAMES[key][1]))
                .on('click', function () { applyValues(presets[key]); })
                .appendTo($box);
        });
        $('<div class="cfg-preset cfg-preset-custom">').toggleClass('active', active === 'custom')
            .append($('<div class="cfg-preset-name">').text('自定义'))
            .appendTo($box);
    }

    // 与后端 ui_style.form_body_attrs() 同一套规则：只写不是「跟随默认」的项
    function refreshPreview() {
        var v = formValues();
        var $p = $('#fspPreview');
        var el = $p[0];
        CLASSES.forEach(function (c) { $p.removeClass(c); });
        VARS.forEach(function (n) { el.style.removeProperty(n); });
        if (v.labelAlign !== 'auto') { $p.addClass('fs-label-' + v.labelAlign); }
        if (v.labelWeight !== 'auto') { $p.addClass('fs-weight-' + v.labelWeight); }
        if (v.fontSize) { el.style.setProperty('--fs-font-size', v.fontSize + 'px'); $p.addClass('fs-font'); }
        if (v.rowGap !== 'auto') { el.style.setProperty('--fs-gap', GAP[v.rowGap]); $p.addClass('fs-gap'); }
        if (v.density !== 'auto') {
            el.style.setProperty('--fs-pad-y', PAD[v.density]);
            $p.addClass('fs-pad').toggleClass('fs-compact', v.density === 'compact');
        }
        if (v.radius !== 'auto') { el.style.setProperty('--fs-radius', RADIUS[v.radius]); $p.addClass('fs-radius'); }
        COLOR_FIELDS.forEach(function (k) {
            if (v[k]) { el.style.setProperty(COLOR_VARS[k][0], v[k]); $p.addClass(COLOR_VARS[k][1]); }
        });
        renderPresets();
    }

    function applyValues(values) {
        applying = true;
        form.option('formData', $.extend({}, values));
        applying = false;
        refreshPreview();
    }

    // 预览表单：覆盖常见编辑器（必填文本、多行、下拉、数字、日期、多选、勾选、只读），便于逐项看效果
    preview = $('#fspPreviewForm').dxForm({
        formData: { category: '演示-减振器', name: '演示-减振器', qty: 12, internal: false, readonly: '不可修改' },
        labelLocation: 'left',
        colCount: 2,
        items: [
            { dataField: 'category', label: { text: '分类' }, isRequired: true },
            { dataField: 'unit', label: { text: '基本单位' }, editorType: 'dxSelectBox', editorOptions: { items: ['pcs', 'set'], placeholder: '选择...' } },
            { dataField: 'name', label: { text: '名称' }, isRequired: true },
            { dataField: 'qty', label: { text: '数量' }, editorType: 'dxNumberBox' },
            { dataField: 'date', label: { text: '日期' }, editorType: 'dxDateBox' },
            { dataField: 'tags', label: { text: '标签' }, editorType: 'dxTagBox', editorOptions: { items: ['A', 'B', 'C'], placeholder: '选择...' } },
            { dataField: 'desc', label: { text: '描述' }, editorType: 'dxTextArea', editorOptions: { height: 56 }, colSpan: 2 },
            { dataField: 'readonly', label: { text: '只读字段' }, editorOptions: { readOnly: true } },
            { dataField: 'internal', label: { text: '是否启用' }, editorType: 'dxCheckBox' }
        ]
    }).dxForm('instance');

    $('#fspIndustrialSwitch').dxSwitch({
        value: false,
        onValueChanged: function (e) { $('#fspPreview').toggleClass('mdm-industrial', e.value); }
    });

    var colorOpts = { applyValueMode: 'instantly', placeholder: '跟随默认', showClearButton: true };
    var follow = { v: 'auto', t: '跟随默认' };
    function select(items) { return { editorType: 'dxSelectBox', editorOptions: { valueExpr: 'v', displayExpr: 't', items: items } }; }
    function colorItem(key) { return { dataField: key, label: { text: LABELS[key] }, editorType: 'dxColorBox', editorOptions: colorOpts }; }
    var gradeItems = [follow, { v: 'compact', t: '紧凑' }, { v: 'normal', t: '标准' }, { v: 'loose', t: '宽松' }];

    form = $('#fspForm').dxForm({
        formData: $.extend({}, style),
        labelLocation: 'left',
        colCount: 2,
        onFieldDataChanged: function () { if (!applying && preview) { refreshPreview(); } },
        items: [
            $.extend({ dataField: 'labelAlign', label: { text: '标签对齐' } }, select([follow, { v: 'left', t: '靠左' }, { v: 'right', t: '靠右' }])),
            colorItem('labelColor'),
            $.extend({ dataField: 'labelWeight', label: { text: '标签字重' } }, select([follow, { v: 'normal', t: '正常' }, { v: 'bold', t: '加粗' }])),
            $.extend({ dataField: 'fontSize', label: { text: '表单字号' } }, select([{ v: 0, t: '跟随默认' }, { v: 12, t: '12px' }, { v: 13, t: '13px' }, { v: 14, t: '14px' }])),
            $.extend({ dataField: 'rowGap', label: { text: '行间距' } }, select(gradeItems)),
            $.extend({ dataField: 'density', label: { text: '输入框高度' } }, select(gradeItems)),
            $.extend({ dataField: 'radius', label: { text: '输入框圆角' } }, select([follow, { v: 'none', t: '无' }, { v: 'small', t: '小' }, { v: 'large', t: '大' }])),
            colorItem('inputBorder'),
            colorItem('inputFocus'),
            colorItem('inputBg'),
            colorItem('readonlyBg'),
            colorItem('valueColor'),
            colorItem('panelBg')
        ]
    }).dxForm('instance');
    refreshPreview();

    $('<div>').appendTo('#fspActions').dxButton({
        text: '保存', type: 'default', icon: 'save',
        onClick: function () {
            apiPost('/api/v1/ui-style/form/save', { values: formValues() }).then(function () {
                DevExpress.ui.notify('已保存', 'success', 2000);
            }, apiError);
        }
    });
    $('<div>').appendTo('#fspActions').dxButton({
        text: '恢复默认', icon: 'revert',
        onClick: function () {
            DevExpress.ui.dialog.confirm('确定恢复为默认方案吗？你保存的表单样式会被清除', '恢复默认').then(function (ok) {
                if (!ok) { return; }
                apiPost('/api/v1/ui-style/form/reset').then(function (def) {
                    applyValues(def);
                    DevExpress.ui.notify('已恢复默认方案', 'success', 2000);
                }, apiError);
            });
        }
    });
});
</script>
{% endblock %}
