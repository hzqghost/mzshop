{% extends "page.html" %}
{% block title %}平台管理{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="platformGrid"></div>
</div>
<script>
$(function () {
    var channel = window.BroadcastChannel ? new BroadcastChannel('mzshop-platform') : null;
    function notifyStores() {
        if (channel) { channel.postMessage({ kind: 'platform' }); }
    }
    function websiteRules() {
        return [{
            type: 'custom', message: '网址需以 http:// 或 https:// 开头',
            validationCallback: function (o) {
                var v = String(o.value || '').trim();
                return !v || /^https?:\/\//i.test(v);
            }
        }, { type: 'stringLength', max: 255, message: '最长 255 个字符' }];
    }
    new DxGrid($('#platformGrid')[0], {
        dataSource: DxGrid.restStore('/api/v1/platforms', 'id'),
        keyExpr: 'id',
        businessToolbar: true,
        editing: {
            mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
            texts: {
                addRow: '新增平台', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                confirmDeleteTitle: '删除平台', confirmDeleteMessage: '确定删除该平台吗？其下还有店铺时不能删除'
            },
            popup: { title: '平台', width: '90%', maxWidth: 700, height: '80%', showTitle: true, showCloseButton: true, hideOnOutsideClick: false },
            form: {
                colCount: 1, labelLocation: 'left',
                items: [
                    { dataField: 'code', label: { text: '编码' } },
                    { dataField: 'name', label: { text: '平台名称' } },
                    { dataField: 'name_en', label: { text: '平台名称(en)' } },
                    { dataField: 'website', label: { text: '网址' }, editorOptions: { placeholder: 'https://' } },
                    { dataField: 'market', label: { text: '市场' } },
                    { dataField: 'feature', label: { text: '特性' }, editorType: 'dxTextArea', editorOptions: { height: 72 } },
                    { dataField: 'remark', label: { text: '备注' }, editorType: 'dxTextArea', editorOptions: { height: 72 } },
                    { dataField: 'is_independent', label: { text: '独立站' } }
                ]
            }
        },
        onInitNewRow: function (e) {
            e.data.is_independent = false;
            e.data.website = '';
            e.component.option('editing.popup.title', '新增平台');
        },
        onEditingStart: function (e) {
            e.component.option('editing.popup.title', '编辑平台');
        },
        onRowDblClick: function (e) {
            if (e.rowType === 'data') { e.component.editRow(e.rowIndex); }
        },
        onRowInserted: function () { DevExpress.ui.notify('平台已新增', 'success', 1800); notifyStores(); },
        onRowUpdated: function () { DevExpress.ui.notify('平台已保存', 'success', 1800); notifyStores(); },
        onRowRemoved: function () { DevExpress.ui.notify('平台已删除', 'success', 1800); notifyStores(); },
        columns: [
            { dataField: 'code', caption: '编码', width: 120, validationRules: [{ type: 'required', message: '请填写编码' }, { type: 'stringLength', max: 50, message: '最长 50 个字符' }] },
            { dataField: 'name', caption: '平台名称', minWidth: 140, validationRules: [{ type: 'required', message: '请填写平台名称' }, { type: 'stringLength', max: 100, message: '最长 100 个字符' }] },
            { dataField: 'name_en', caption: '平台名称(en)', minWidth: 140, validationRules: [{ type: 'stringLength', max: 100, message: '最长 100 个字符' }] },
            {
                dataField: 'website', caption: '网址', width: 200, validationRules: websiteRules(),
                editorOptions: { placeholder: 'https://' },
                cellTemplate: function (el, o) {
                    if (!o.value) { return; }
                    $('<a class="cell-link" target="_blank" rel="noopener"></a>').attr({ href: o.value, title: o.value }).text(o.value).appendTo(el);
                }
            },
            { dataField: 'market', caption: '市场', width: 120, validationRules: [{ type: 'stringLength', max: 100, message: '最长 100 个字符' }] },
            { dataField: 'feature', caption: '特性', minWidth: 160, validationRules: [{ type: 'stringLength', max: 500, message: '最长 500 个字符' }] },
            { dataField: 'remark', caption: '备注', minWidth: 140, validationRules: [{ type: 'stringLength', max: 500, message: '最长 500 个字符' }] },
            { dataField: 'is_independent', caption: '独立站', dataType: 'boolean', width: 90, trueText: '是', falseText: '否' },
            { dataField: 'store_count', caption: '店铺数', dataType: 'number', width: 80, allowEditing: false, formItem: { visible: false } },
            { dataField: 'id', caption: 'ID', width: 70, allowEditing: false, formItem: { visible: false } },
            { dataField: 'updated_at', caption: '更新时间', width: 160, allowEditing: false, formItem: { visible: false } },
            { type: 'buttons', caption: '操作', width: 90, buttons: ['edit', 'delete'] }
        ]
    });
});
</script>
<style>
.cell-link { color: var(--mdm-primary, #0C6C9E); display: inline-block; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
</style>
{% endblock %}
