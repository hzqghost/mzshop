{% extends "page.html" %}
{% block title %}同步任务{% endblock %}
{% block body %}
<div class="page-pad shopify-tasks-page">
    <div class="task-note">任务由独立 Shopify worker 处理。长时间停留在“等待中”表示 worker 尚未运行；失败任务可在操作列查看错误并重试。</div>
    <div id="shopifyTaskGrid"></div>
</div>
<script src="/static/js/lib/shop.js?v=20261119"></script>
<script>
var shopifyTaskGrid;

function taskCall(method, path, body) {
    return $.ajax({
        url: APP.HOST + '/api/v1/shopify' + path,
        method: method,
        contentType: 'application/json',
        data: body == null ? undefined : JSON.stringify(body)
    }).then(function (res) {
        if (!res || res.code !== 0) { return $.Deferred().reject((res && res.msg) || '请求失败').promise(); }
        return res.data;
    }, function (xhr) {
        if (xhr.status === 401) { (window.top || window).location.href = APP.HOST + '/login'; }
        return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '请求失败').promise();
    });
}

function showTaskError(row) {
    var text = row.error_message || '没有错误信息';
    var safe = $('<div></div>').text(text).html();
    DevExpress.ui.dialog.alert('<div class="task-error-text">' + safe + '</div>', '任务 #' + row.id + ' 错误详情');
}

$(function () {
    var statuses = [
        { value: 'pending', text: '等待中' },
        { value: 'running', text: '处理中' },
        { value: 'success', text: '成功' },
        { value: 'failed', text: '失败' },
        { value: 'cancelled', text: '已取消' }
    ];
    var actions = [
        { value: 'upsert_product', text: '同步商品' },
        { value: 'archive_product', text: '归档商品' },
        { value: 'sync_inventory', text: '同步库存' }
    ];
    shopifyTaskGrid = new DxGrid($('#shopifyTaskGrid')[0], {
        dataSource: DxGrid.remoteStore('/api/v1/shopify/tasks', 'id'),
        keyExpr: 'id',
        businessToolbar: true,
        remoteOperations: { paging: true, filtering: true, sorting: true },
        headerFilter: { visible: false },
        paging: { pageSize: 30 },
        pager: { visible: true, showPageSizeSelector: true, allowedPageSizes: [20, 30, 50, 100], showInfo: true },
        batchActions: [
            {
                id: 'retry', text: '批量重试', confirm: '确定重试选中的 {n} 个任务吗？',
                run: function (ids) {
                    return taskCall('POST', '/tasks/batch-retry', { ids: ids }).then(function (result) {
                        var type = result.updated ? 'success' : 'warning';
                        DevExpress.ui.notify('已重试 ' + result.updated + ' 个，跳过 ' + result.skipped + ' 个', type, 2600);
                        return result;
                    });
                }
            }
        ],
        batchDelete: function (id) {
            return taskCall('DELETE', '/tasks/' + id);
        },
        columns: [
            { dataField: 'id', caption: '任务ID', width: 90 },
            { dataField: 'status', caption: '状态', width: 100, lookup: { dataSource: statuses, valueExpr: 'value', displayExpr: 'text' },
              cellTemplate: function (el, o) {
                  var item = statuses.filter(function (x) { return x.value === o.value; })[0];
                  $('<span class="task-status task-' + String(o.value || '') + '"></span>').text(item ? item.text : o.value).appendTo(el);
              } },
            { dataField: 'goods_no', caption: '商品编码', width: 130,
              cellTemplate: function (el, o) {
                  $('<a href="#" class="task-goods-link"></a>').text(o.value || '').attr('title', '打开商品详情').on('click', function (e) {
                      e.preventDefault(); e.stopPropagation();
                      openAdminTab('/goodsEdit?id=' + o.data.goods_id, '商品 · ' + (o.data.goods_name || o.value || o.data.goods_id));
                  }).appendTo(el);
              } },
            { dataField: 'goods_name', caption: '商品名称', minWidth: 220 },
            { dataField: 'store_name', caption: '店铺', width: 160 },
            { dataField: 'action', caption: '动作', width: 110, lookup: { dataSource: actions, valueExpr: 'value', displayExpr: 'text' } },
            { dataField: 'retry_count', caption: '已重试', dataType: 'number', width: 85,
              calculateCellValue: function (row) { return (row.retry_count || 0) + ' / ' + (row.max_retries || 0); } },
            { dataField: 'created_at', caption: '创建时间', dataType: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', width: 165 },
            { dataField: 'started_at', caption: '开始时间', dataType: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', width: 165 },
            { dataField: 'finished_at', caption: '完成时间', dataType: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', width: 165 },
            { dataField: 'next_retry_at', caption: '下次重试', dataType: 'datetime', format: 'yyyy-MM-dd HH:mm:ss', width: 165 },
            { dataField: 'request_id', caption: 'Shopify Request ID', minWidth: 210, visible: false },
            { dataField: 'error_message', caption: '错误信息', minWidth: 260,
              cellTemplate: function (el, o) {
                  if (!o.value) { return; }
                  $('<a href="#" class="task-error-link"></a>').text(o.value).attr('title', o.value).on('click', function (e) {
                      e.preventDefault(); e.stopPropagation(); showTaskError(o.data);
                  }).appendTo(el);
              } },
            { dataField: 'goods_id', caption: '商品ID', width: 90, visible: false },
            { dataField: 'store_id', caption: '店铺ID', width: 90, visible: false },
            { type: 'buttons', caption: '操作', width: 110, buttons: [
                { icon: 'info', hint: '查看错误', visible: function (e) { return !!e.row.data.error_message; },
                  onClick: function (e) { showTaskError(e.row.data); } },
                { icon: 'repeat', hint: '重试', visible: function (e) { return ['failed', 'cancelled'].indexOf(e.row.data.status) >= 0; },
                  onClick: function (e) {
                      DevExpress.ui.dialog.confirm('确定重试任务 #' + e.row.data.id + ' 吗？', '重试 Shopify 任务').then(function (yes) {
                          if (!yes) { return; }
                          taskCall('POST', '/tasks/' + e.row.data.id + '/retry').then(function () {
                              DevExpress.ui.notify('任务已重新加入等待队列', 'success', 2000); shopifyTaskGrid.refresh();
                          }, function (msg) { DevExpress.ui.notify(String(msg), 'error', 3000); });
                      });
                  } }
            ] }
        ]
    });
});
</script>
<style>
.task-note { padding: 9px 12px; margin-bottom: 10px; color: #755600; background: #fff8df; border: 1px solid #f1df9a; border-radius: 4px; }
.task-status { display: inline-block; min-width: 56px; padding: 2px 8px; border-radius: 10px; text-align: center; font-size: 12px; }
.task-pending { color: #735c00; background: #fff2bd; }
.task-running { color: #075f96; background: #dceffc; }
.task-success { color: #126b35; background: #dff3e7; }
.task-failed { color: #a02727; background: #fbe1e1; }
.task-cancelled { color: #666; background: #ececec; }
.task-goods-link { color: #0C6C9E; text-decoration: underline; cursor: pointer; }
.task-error-link { display: block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b02a2a; }
.task-error-text { max-width: 680px; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
</style>
{% endblock %}
