{% extends "page.html" %}
{% block title %}店铺管理{% endblock %}
{% block body %}
<div class="page-pad">
    <div id="storeGrid"></div>
</div>
<script src="/static/js/lib/shop.js?v=20261119-3"></script>
<script>
/* 独立站不在店铺上编辑，显示所属平台的值。换平台时，弹窗里的勾选跟着变。 */
var platformById = {};

function loadPlatforms() {
    return $.ajax({ url: APP.HOST + '/api/v1/platforms', method: 'GET' }).then(function (res) {
        if (res.code !== 0) { return $.Deferred().reject(res.msg).promise(); }
        platformById = {};
        (res.data || []).forEach(function (p) { platformById[p.id] = p; });
        return res.data || [];
    }, function (xhr) {
        if (xhr.status === 401) { (window.top || window).location.href = APP.HOST + '/login'; }
        return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '平台加载失败').promise();
    });
}

function loadCategories() {
    return Shop.call('GET', '/categories').then(function (rows) { return rows || []; });
}

function paintIndependent(grid, platformId) {
    var p = platformById[platformId];
    var flag = !!(p && p.is_independent);
    var row = grid.getVisibleRows().filter(function (r) { return r.isEditing; })[0];
    if (row && row.data) { row.data.is_independent = flag; }
    var box = $('.dx-overlay-wrapper:visible .dx-field-item').filter(function () {
        return $(this).find('.dx-field-item-label-text').first().text() === '独立站';
    }).find('.dx-checkbox');
    var inst = box.length ? DevExpress.ui.dxCheckBox.getInstance(box.get(0)) : null;
    if (inst) { inst.option('value', flag); }
}

function openShopifyConfig(store) {
    var $host = $('<div></div>').appendTo(document.body), state = { locations: [], publications: [] }, form;
    function request(method, path, body) {
        return $.ajax({ url: APP.HOST + path, method: method, contentType: 'application/json',
            data: body == null ? undefined : JSON.stringify(body) }).then(function (res) {
            if (!res || res.code !== 0) { return $.Deferred().reject((res && res.msg) || '请求失败').promise(); }
            return res.data;
        }, function (xhr) { return $.Deferred().reject((xhr.responseJSON && xhr.responseJSON.msg) || '请求失败').promise(); });
    }
    request('GET', '/api/v1/shopify/stores/' + store.id).then(function (pack) {
        var data = $.extend({}, pack.config || {});
        var popup = $host.dxPopup({ title: 'Shopify 配置 · ' + store.name, width: '90%', maxWidth: 720, height: '80%',
            showCloseButton: true, hideOnOutsideClick: false, onHidden: function () { $host.remove(); },
            contentTemplate: function (el) {
                var $form = $('<div></div>').appendTo(el);
                form = $form.dxForm({ formData: data, labelLocation: 'left', colCount: 1, items: [
                    { dataField: 'shop_domain', label: { text: '店铺域名' }, editorOptions: { placeholder: 'xxx.myshopify.com' },
                      validationRules: [{ type: 'required', message: '请填写店铺域名' }] },
                    { dataField: 'region_id', label: { text: '价格区域' }, editorType: 'dxSelectBox', editorOptions: {
                        dataSource: pack.regions || [], valueExpr: 'id', displayExpr: 'name', searchEnabled: true },
                      validationRules: [{ type: 'required', message: '请选择价格区域' }] },
                    { dataField: 'language_code', label: { text: '商品语言' }, editorType: 'dxSelectBox', editorOptions: {
                        dataSource: [{ code: '', name: '默认语言' }].concat(pack.languages || []), valueExpr: 'code', displayExpr: 'name' } },
                    { dataField: 'default_location_gid', label: { text: '库存地点' }, editorType: 'dxSelectBox', editorOptions: {
                        dataSource: state.locations, valueExpr: 'id', displayExpr: 'name', acceptCustomValue: true } },
                    { dataField: 'stock_location_id', label: { text: 'mzShop库存地点' }, editorType: 'dxSelectBox', editorOptions: {
                        dataSource: pack.stock_locations || [], valueExpr: 'id', displayExpr: 'name', searchEnabled: true },
                      validationRules: [{ type: 'required', message: '请选择mzShop库存地点' }] },
                    { dataField: 'publication_gid', label: { text: '发布渠道' }, editorType: 'dxSelectBox', editorOptions: {
                        dataSource: state.publications, valueExpr: 'id', displayExpr: 'name', acceptCustomValue: true } },
                    { dataField: 'currency', label: { text: '币种' }, editorOptions: { maxLength: 3, readOnly: true } },
                    { dataField: 'sync_enabled', label: { text: '允许同步' }, editorType: 'dxSwitch' },
                    { dataField: 'connection_status', label: { text: '连接状态' }, editorOptions: { readOnly: true } },
                    { dataField: 'last_error', label: { text: '最近错误' }, editorType: 'dxTextArea', editorOptions: { readOnly: true, height: 60 } },
                    { itemType: 'button', horizontalAlignment: 'left', buttonOptions: { text: '测试连接并读取选项', icon: 'check', onClick: function () {
                        var current = form.option('formData');
                        request('POST', '/api/v1/shopify/stores/' + store.id + '/test', { shop_domain: current.shop_domain }).then(function (result) {
                            state.locations = (result.locations || []).filter(function (x) { return x.isActive; });
                            state.publications = result.publications || [];
                            form.getEditor('default_location_gid').option('dataSource', state.locations);
                            form.getEditor('publication_gid').option('dataSource', state.publications);
                            current.currency = (result.shop && result.shop.currencyCode) || current.currency;
                            current.connection_status = result.missing_scopes.length ? 'error' : 'ok';
                            current.last_error = result.missing_scopes.length ? '缺少权限：' + result.missing_scopes.join('、') : '';
                            if (!current.default_location_gid && state.locations.length) { current.default_location_gid = state.locations[0].id; }
                            var online = state.publications.filter(function (x) { return /online store/i.test(x.name || ''); })[0];
                            if (!current.publication_gid && online) { current.publication_gid = online.id; }
                            form.option('formData', current);
                            DevExpress.ui.notify(result.missing_scopes.length ? '连接成功，但权限不完整' : '连接成功', result.missing_scopes.length ? 'warning' : 'success', 2500);
                        }, function (msg) { DevExpress.ui.notify(String(msg), 'error', 3500); });
                    } } },
                    { itemType: 'button', horizontalAlignment: 'left', buttonOptions: { text: '注册订单 Webhook', icon: 'event', onClick: function () {
                        request('POST', '/api/v1/shopify/stores/' + store.id + '/webhooks/register', {}).then(function (result) {
                            DevExpress.ui.notify('Webhook 已就绪：新增 ' + result.created.length + '，已有 ' + result.skipped.length, 'success', 3000);
                        }, function (msg) { DevExpress.ui.notify(String(msg), 'error', 4000); });
                    } } }
                ] }).dxForm('instance');
            }, toolbarItems: [
                { toolbar: 'bottom', location: 'after', widget: 'dxButton', options: { text: '取消', onClick: function () { popup.hide(); } } },
                { toolbar: 'bottom', location: 'after', widget: 'dxButton', options: { text: '保存', type: 'default', onClick: function () {
                    if (!form.validate().isValid) { return; }
                    request('PUT', '/api/v1/shopify/stores/' + store.id, form.option('formData')).then(function () {
                        var tested = form.option('formData').connection_status === 'ok';
                        DevExpress.ui.notify(tested ? 'Shopify 配置已保存，连接状态正常' : 'Shopify 配置已保存，请测试连接', 'success', 2200); popup.hide();
                    }, function (msg) { DevExpress.ui.notify(String(msg), 'error', 3500); });
                } } }
            ] }).dxPopup('instance');
        popup.show();
    }, function (msg) { $host.remove(); DevExpress.ui.notify(String(msg), 'error', 3500); });
}

function catNames(c) {
    var names = [c.name || ''];
    if (c.i18n) {
        Object.keys(c.i18n).forEach(function (code) {
            var n = c.i18n[code] && c.i18n[code].name;
            if (n) { names.push(n); }
        });
    }
    return names.filter(Boolean);
}

function catLabel(c) {
    var names = catNames(c);
    return names.length > 1 ? names[0] + ' (' + names.slice(1).join(' / ') + ')' : names[0];
}

function catSearchBlob(c) {
    return (catNames(c).join('\n') + '\n' + (c.full_name || '')).toLowerCase();
}

function openBindCategories(store, onSaved) {
    loadCategories().then(function (rows) {
        var byId = {};
        var byParent = {};
        rows.forEach(function (c) {
            byId[c.id] = c;
            var pid = c.parent_id || 0;
            (byParent[pid] = byParent[pid] || []).push(c);
        });
        Object.keys(byParent).forEach(function (pid) {
            byParent[pid].sort(function (a, b) {
                return (a.sort_order - b.sort_order) || a.id - b.id;
            });
        });
        function kidsOf(id) { return byParent[id] || []; }
        function descendants(id) {
            var out = [];
            kidsOf(id).forEach(function (ch) {
                out.push(ch.id);
                out = out.concat(descendants(ch.id));
            });
            return out;
        }
        var selected = {};
        (store.category_ids || []).forEach(function (id) { if (byId[id]) { selected[id] = true; } });
        var tab = 'pick';
        var keyword = '';
        var $win = null;

        var $host = $('<div></div>').appendTo(document.body);
        var popup = $host.dxPopup({
            title: '选择分类（可多选） — ' + store.name,
            width: '90%', height: '80%', showTitle: true, dragEnabled: true,
            hideOnOutsideClick: false, showCloseButton: true,
            toolbarItems: [
                { toolbar: 'bottom', location: 'after', widget: 'dxButton', options: { text: '保存', type: 'default', stylingMode: 'contained', onClick: save } },
                { toolbar: 'bottom', location: 'after', widget: 'dxButton', options: { text: '取消', onClick: function () { popup.hide(); } } }
            ],
            contentTemplate: mount,
            onHidden: function () { $host.remove(); }
        }).dxPopup('instance');
        popup.show();

        function selectedIds() {
            return Object.keys(selected).filter(function (k) { return selected[k]; }).map(Number);
        }

        function setChecked(id, on) {
            if (on) { selected[id] = true; } else { delete selected[id]; }
        }

        function toggleNode(id, on) {
            setChecked(id, on);
            descendants(id).forEach(function (cid) { setChecked(cid, on); });
        }

        function visibleIds($box) {
            var ids = [];
            $box.find('input[type="checkbox"][data-id]').each(function () {
                var n = Number($(this).attr('data-id'));
                if (n) { ids.push(n); }
            });
            return ids;
        }

        function addCheck($parent, node, kind) {
            var $item = $('<label class="cat-pick-label"></label>').addClass(kind || '').appendTo($parent);
            $('<input type="checkbox">').attr('data-id', node.id).appendTo($item);
            $('<span></span>').text(catLabel(node)).attr('title', node.full_name || catLabel(node)).appendTo($item);
            return $item;
        }

        function renderTree($box) {
            $box.empty();
            if (!rows.length) {
                $box.append($('<div class="cat-pick-empty"></div>').text('还没有商品分类，请先到「商品分类」里维护'));
                return;
            }
            function renderLevel(parentId, $container) {
                kidsOf(parentId).forEach(function (node) {
                    var kids = kidsOf(node.id);
                    var $group = $('<div class="cat-pick-group"></div>').appendTo($container);
                    var $head = $('<div class="cat-pick-head"></div>').appendTo($group);
                    addCheck($head, node, 'cat-pick-parent');
                    if (!kids.length) { return; }
                    var allLeaves = kids.every(function (k) { return !kidsOf(k.id).length; });
                    if (allLeaves) {
                        var $items = $('<div class="cat-pick-items"></div>').appendTo($group);
                        kids.forEach(function (leaf) { addCheck($items, leaf, 'cat-pick-item'); });
                    } else {
                        renderLevel(node.id, $('<div class="cat-pick-sub"></div>').appendTo($group));
                    }
                });
            }
            renderLevel(0, $box);
        }

        function renderSearch($box, q) {
            $box.empty();
            q = String(q || '').trim().toLowerCase();
            if (!q) {
                $box.append($('<div class="cat-pick-empty"></div>').text('输入分类名称查询，支持默认语言和其他语言译文'));
                return;
            }
            var hit = {};
            rows.forEach(function (c) {
                if (catSearchBlob(c).indexOf(q) >= 0) { hit[c.id] = true; }
            });
            var shown = rows.filter(function (c) { return hit[c.id]; });
            if (!shown.length) {
                $box.append($('<div class="cat-pick-empty"></div>').text('没有匹配的分类'));
                return;
            }
            var $items = $('<div class="cat-pick-search-items"></div>').appendTo($box);
            shown.forEach(function (c) {
                var $row = $('<label class="cat-pick-label cat-pick-search-row"></label>').appendTo($items);
                $('<input type="checkbox">').attr('data-id', c.id).appendTo($row);
                var $text = $('<span></span>').appendTo($row);
                $('<b></b>').text(catLabel(c)).appendTo($text);
                if (c.full_name && c.full_name !== c.name) {
                    $('<em></em>').text(c.full_name).appendTo($text);
                }
            });
        }

        function syncChecks($root) {
            $root.find('input[type="checkbox"][data-id]').each(function () {
                var id = Number($(this).attr('data-id'));
                var nodeSelected = !!selected[id];
                var desc = descendants(id);
                var some = desc.some(function (cid) { return selected[cid]; });
                this.checked = nodeSelected;
                this.indeterminate = !nodeSelected && some;
            });
        }

        function paint() {
            if (!$win) { return; }
            $win.find('.cat-pick-tab').toggleClass('is-on', false);
            $win.find('.cat-pick-tab[data-tab="' + tab + '"]').addClass('is-on');
            $win.find('.cat-pick-pane').hide();
            var $pane = $win.find('.cat-pick-pane[data-tab="' + tab + '"]').show();
            if (tab === 'pick') {
                renderTree($pane.find('.cat-pick-body'));
            } else {
                renderSearch($pane.find('.cat-pick-body'), keyword);
            }
            syncChecks($pane);
            $win.find('.cat-pick-count').text('已选 ' + selectedIds().length);
        }

        function mount(content) {
            $win = $('<div class="cat-pick"></div>').appendTo(content);
            var $tabs = $('<div class="cat-pick-tabs"></div>').appendTo($win);
            $('<button type="button" class="cat-pick-tab is-on" data-tab="pick">选择分类</button>').on('click', function () {
                tab = 'pick'; paint();
            }).appendTo($tabs);
            $('<button type="button" class="cat-pick-tab" data-tab="search">查询分类</button>').on('click', function () {
                tab = 'search'; paint();
            }).appendTo($tabs);
            var $bar = $('<div class="cat-pick-bar"></div>').appendTo($win);
            $('<button type="button" class="cat-pick-all">全选/全不选</button>').on('click', function () {
                var ids = visibleIds($win.find('.cat-pick-pane:visible'));
                if (!ids.length) { return; }
                var allOn = ids.every(function (id) { return selected[id]; });
                ids.forEach(function (id) { setChecked(id, !allOn); });
                syncChecks($win.find('.cat-pick-pane:visible'));
                $win.find('.cat-pick-count').text('已选 ' + selectedIds().length);
            }).appendTo($bar);
            $('<span class="cat-pick-count">已选 0</span>').appendTo($bar);

            var $pick = $('<div class="cat-pick-pane" data-tab="pick"></div>').appendTo($win);
            $('<div class="cat-pick-body"></div>').appendTo($pick);

            var $search = $('<div class="cat-pick-pane" data-tab="search" style="display:none"></div>').appendTo($win);
            var $q = $('<div class="cat-pick-q"></div>').appendTo($search);
            $('<input type="text" class="cat-pick-input" placeholder="输入分类名称查询（支持各语言）">').appendTo($q);
            $('<div class="cat-pick-body"></div>').appendTo($search);

            $win.on('change', 'input[type="checkbox"][data-id]', function () {
                toggleNode(Number($(this).attr('data-id')), this.checked);
                syncChecks($win.find('.cat-pick-pane:visible'));
                $win.find('.cat-pick-count').text('已选 ' + selectedIds().length);
            });
            var timer = null;
            $win.on('input', '.cat-pick-input', function () {
                var val = this.value;
                clearTimeout(timer);
                timer = setTimeout(function () {
                    keyword = val;
                    if (tab === 'search') { paint(); $win.find('.cat-pick-input').val(keyword).focus(); }
                }, 200);
            });
            paint();
        }

        function save() {
            var ids = selectedIds();
            $.ajax({
                url: APP.HOST + '/api/v1/stores/' + store.id + '/categories',
                method: 'PUT', contentType: 'application/json',
                data: JSON.stringify({ category_ids: ids })
            }).then(function (res) {
                if (res.code !== 0) { return $.Deferred().reject(res.msg).promise(); }
                popup.hide();
                DevExpress.ui.notify('分类已绑定', 'success', 1800);
                if (onSaved) { onSaved(ids); }
            }, function (xhr) {
                if (xhr.status === 401) { (window.top || window).location.href = APP.HOST + '/login'; }
                apiError((xhr.responseJSON && xhr.responseJSON.msg) || xhr.statusText || '保存失败');
            });
        }
    }, function (msg) { DevExpress.ui.notify(String(msg), 'error', 3000); });
}

$(function () {
    loadPlatforms().then(function (platforms) {
        var channel = window.BroadcastChannel ? new BroadcastChannel('mzshop-platform') : null;
        var grid = new DxGrid($('#storeGrid')[0], {
            dataSource: DxGrid.restStore('/api/v1/stores', 'id'),
            keyExpr: 'id',
            businessToolbar: true,
            editing: {
                mode: 'popup', allowAdding: true, allowUpdating: true, allowDeleting: true, useIcons: true,
                texts: {
                    addRow: '新增店铺', editRow: '编辑', deleteRow: '删除', saveRowChanges: '保存', cancelRowChanges: '取消',
                    confirmDeleteTitle: '删除店铺', confirmDeleteMessage: '确定删除该店铺吗？'
                },
                popup: { title: '店铺', width: '90%', maxWidth: 700, height: '80%', showTitle: true, showCloseButton: true, hideOnOutsideClick: false },
                form: {
                    colCount: 1, labelLocation: 'left',
                    items: [
                        { dataField: 'platform_id', label: { text: '平台' } },
                        { dataField: 'code', label: { text: '编码' } },
                        { dataField: 'name', label: { text: '店铺名称' } },
                        { dataField: 'name_en', label: { text: '店铺名称(en)' } },
                        { dataField: 'shipping_package_group_id', label: { text: '默认包装组' } },
                        { dataField: 'website', label: { text: '网址' }, editorOptions: { placeholder: 'https://' } },
                        { dataField: 'feature', label: { text: '特性' }, editorType: 'dxTextArea', editorOptions: { height: 72 } },
                        { dataField: 'remark', label: { text: '备注' }, editorType: 'dxTextArea', editorOptions: { height: 72 } },
                        { dataField: 'is_independent', label: { text: '独立站' }, helpText: '来自所选平台，此处不能修改' }
                    ]
                }
            },
            onInitNewRow: function (e) {
                e.data.is_independent = false;
                e.data.website = '';
                e.data.category_ids = [];
                e.data.category_count = 0;
                e.data.shipping_package_group_id = 0;
                e.component.option('editing.popup.title', '新增店铺');
            },
            onEditingStart: function (e) {
                e.component.option('editing.popup.title', '编辑店铺');
            },
            onRowDblClick: function (e) {
                if (e.rowType === 'data') { e.component.editRow(e.rowIndex); }
            },
            onEditorPreparing: function (e) {
                if (e.parentType !== 'dataRow') { return; }
                if (e.dataField === 'is_independent') {
                    e.editorOptions.disabled = true;
                }
                if (e.dataField === 'platform_id') {
                    var prev = e.editorOptions.onValueChanged;
                    e.editorOptions.onValueChanged = function (args) {
                        if (typeof prev === 'function') { prev(args); }
                        paintIndependent(e.component, args.value);
                    };
                }
            },
            onRowInserted: function () { DevExpress.ui.notify('店铺已新增', 'success', 1800); },
            onRowUpdated: function () { DevExpress.ui.notify('店铺已保存', 'success', 1800); },
            onRowRemoved: function () { DevExpress.ui.notify('店铺已删除', 'success', 1800); },
            columns: [
                {
                    dataField: 'platform_id', caption: '平台', width: 160,
                    lookup: { dataSource: platforms, valueExpr: 'id', displayExpr: 'name' },
                    validationRules: [{ type: 'required', message: '请选择平台' }]
                },
                { dataField: 'code', caption: '编码', width: 120, validationRules: [{ type: 'required', message: '请填写编码' }, { type: 'stringLength', max: 50, message: '最长 50 个字符' }] },
                { dataField: 'name', caption: '店铺名称', minWidth: 140, validationRules: [{ type: 'required', message: '请填写店铺名称' }, { type: 'stringLength', max: 100, message: '最长 100 个字符' }] },
                { dataField: 'name_en', caption: '店铺名称(en)', minWidth: 140, validationRules: [{ type: 'stringLength', max: 100, message: '最长 100 个字符' }] },
                { dataField: 'shipping_package_group_id', caption: '默认包装组', minWidth: 140,
                  lookup: { dataSource: Shop.packageGroupSource('未设置'), valueExpr: 'id', displayExpr: 'name' } },
                {
                    dataField: 'website', caption: '网址', width: 200,
                    editorOptions: { placeholder: 'https://' },
                    validationRules: [{
                        type: 'custom', message: '网址需以 http:// 或 https:// 开头',
                        validationCallback: function (o) {
                            var v = String(o.value || '').trim();
                            return !v || /^https?:\/\//i.test(v);
                        }
                    }, { type: 'stringLength', max: 255, message: '最长 255 个字符' }],
                    cellTemplate: function (el, o) {
                        if (!o.value) { return; }
                        $('<a class="cell-link" target="_blank" rel="noopener"></a>').attr({ href: o.value, title: o.value }).text(o.value).appendTo(el);
                    }
                },
                { dataField: 'feature', caption: '特性', minWidth: 160, validationRules: [{ type: 'stringLength', max: 500, message: '最长 500 个字符' }] },
                { dataField: 'remark', caption: '备注', minWidth: 140, validationRules: [{ type: 'stringLength', max: 500, message: '最长 500 个字符' }] },
                {
                    dataField: 'is_independent', caption: '独立站', dataType: 'boolean', width: 90,
                    trueText: '是', falseText: '否',
                    editorOptions: { disabled: true },
                    formItem: { helpText: '来自所选平台，此处不能修改' }
                },
                {
                    dataField: 'category_roots', caption: '绑定分类', minWidth: 240, allowEditing: false,
                    allowSorting: false, formItem: { visible: false },
                    calculateCellValue: function (row) {
                        var names = (row.category_roots || []).map(function (c) { return c.name; });
                        var extra = (row.category_root_total || 0) > names.length ? '等' : '';
                        var leaf = row.category_leaf_count || 0;
                        if (!names.length && !leaf) { return ''; }
                        return names.join('、') + extra + (leaf ? '（小类 ' + leaf + '）' : '（小类 0）');
                    },
                    cellTemplate: function (el, o) {
                        var roots = (o.data && o.data.category_roots) || [];
                        var leaf = (o.data && o.data.category_leaf_count) || 0;
                        var total = (o.data && o.data.category_root_total) || roots.length;
                        if (!roots.length && !leaf) {
                            $('<span class="muted"></span>').text('未绑定').appendTo(el);
                            return;
                        }
                        var names = roots.map(function (c) { return c.name; }).join('、');
                        if (total > roots.length) { names += '等'; }
                        var $cell = $('<div class="cat-bound"></div>').attr('title', names + '；小类 ' + leaf).appendTo(el);
                        $('<span class="cat-bound-names"></span>').text(names).appendTo($cell);
                        $('<span class="cat-bound-n"></span>').text('（小类 ' + leaf + '）').appendTo($cell);
                    }
                },
                { dataField: 'id', caption: 'ID', width: 70, allowEditing: false, formItem: { visible: false } },
                { dataField: 'updated_at', caption: '更新时间', width: 160, allowEditing: false, formItem: { visible: false } },
                {
                    type: 'buttons', caption: '操作', width: 160,
                    buttons: [
                        'edit',
                        {
                            icon: 'cart', hint: 'Shopify 配置',
                            visible: function (e) { var p = platformById[e.row.data.platform_id] || {}; return String(p.code || '').toLowerCase() === 'shopify' || String(p.name_en || '').toLowerCase() === 'shopify'; },
                            onClick: function (e) { openShopifyConfig(e.row.data); }
                        },
                        {
                            icon: 'link', hint: '绑定分类',
                            onClick: function (e) {
                                openBindCategories(e.row.data, function (ids) {
                                    e.row.data.category_ids = ids;
                                    e.row.data.category_count = ids.length;
                                    grid.refresh();
                                });
                            }
                        },
                        'delete'
                    ]
                }
            ]
        });
        if (channel) {
            channel.addEventListener('message', function (e) {
                if (!e.data || e.data.kind !== 'platform') { return; }
                loadPlatforms().then(function (list) {
                    grid.columnOption('platform_id', 'lookup.dataSource', list);
                    grid.refresh();
                });
            });
        }
    }, function (msg) {
        $('#storeGrid').text(msg || '平台加载失败');
    });
});
</script>
