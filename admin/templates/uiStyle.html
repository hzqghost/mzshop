{% extends "page.html" %}
{% block title %}UI配置{% endblock %}
{% block body %}
<style>
html, body { overflow: hidden; }
.ui-config-page { height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; padding: 12px; }
.ui-config-tabs { flex: 0 0 auto; border-bottom: 1px solid #d9dee7; }
.ui-config-tab { display: inline-block; padding: 10px 18px; cursor: pointer; color: #555; border-bottom: 2px solid transparent; }
.ui-config-tab.active { color: #0c6c9e; border-bottom-color: #0c6c9e; }
.ui-config-content { flex: 1; min-height: 0; position: relative; background: #fff; }
.ui-config-pane { display: none; position: absolute; inset: 0; overflow: auto; }
.ui-config-pane.active { display: block; }
.ui-config-frame { width: 100%; height: 100%; border: 0; display: block; }
.menu-config { max-width: 720px; padding: 18px 8px; }
.menu-config .cfg-card { margin-bottom: 12px; }
.menu-config-form { max-width: 460px; }
.menu-config-actions { display: flex; gap: 8px; margin-top: 16px; }
</style>

<div class="ui-config-page">
    <div class="ui-config-tabs">
        <div class="ui-config-tab" data-tab="menu">菜单 Menu</div>
        <div class="ui-config-tab" data-tab="grid">Grid 表格</div>
        <div class="ui-config-tab" data-tab="form">Form 表单</div>
    </div>
    <div class="ui-config-content">
        <div class="ui-config-pane" data-pane="menu">
            <div class="menu-config">
                <div class="cfg-card">
                    <div class="cfg-title">菜单</div>
                    <div class="cfg-tip">设置左侧菜单展开时的宽度，只对当前登录用户有效。</div>
                    <div id="menuConfigForm" class="menu-config-form"></div>
                </div>
                <div id="menuConfigActions" class="menu-config-actions"></div>
            </div>
        </div>
        <div class="ui-config-pane" data-pane="grid">
            <iframe class="ui-config-frame" data-src="/gridStyle" title="Grid 表格配置"></iframe>
        </div>
        <div class="ui-config-pane" data-pane="form">
            <iframe class="ui-config-frame" data-src="/formStyle" title="Form 表单配置"></iframe>
        </div>
    </div>
</div>

<script>
$(function () {
    var menuStyle = {{ menu_style|tojson }};
    var validTabs = ['menu', 'grid', 'form'];
    var requested = new URLSearchParams(window.location.search).get('tab');
    var activeTab = validTabs.indexOf(requested) >= 0 ? requested : 'menu';

    function activate(tab) {
        activeTab = tab;
        $('.ui-config-tab').removeClass('active').filter('[data-tab="' + tab + '"]').addClass('active');
        $('.ui-config-pane').removeClass('active').filter('[data-pane="' + tab + '"]').addClass('active');
        var $frame = $('.ui-config-pane[data-pane="' + tab + '"] iframe');
        if ($frame.length && !$frame.attr('src')) { $frame.attr('src', $frame.data('src')); }
        var url = new URL(window.location.href);
        url.searchParams.set('tab', tab);
        window.history.replaceState(null, '', url.pathname + url.search);
    }

    $('.ui-config-tab').on('click', function () { activate($(this).data('tab')); });

    var menuForm = $('#menuConfigForm').dxForm({
        formData: $.extend({}, menuStyle),
        labelLocation: 'left',
        colCount: 1,
        items: [{
            dataField: 'width',
            label: { text: '菜单宽度' },
            editorType: 'dxNumberBox',
            editorOptions: { min: 120, max: 480, step: 10, showSpinButtons: true, format: '#0 px' },
            validationRules: [{ type: 'required', message: '请输入菜单宽度' }]
        }]
    }).dxForm('instance');

    function applyMenuWidth(width) {
        try {
            var sidebar = window.parent.document.getElementById('sidebar');
            if (sidebar) { sidebar.style.setProperty('--sidebar-width', width + 'px'); }
        } catch (e) {
            // 独立打开配置页时，保存后刷新后台外壳生效。
        }
    }

    $('<div>').appendTo('#menuConfigActions').dxButton({
        text: '保存', type: 'default', icon: 'save',
        onClick: function () {
            if (!menuForm.validate().isValid) { return; }
            var width = menuForm.option('formData').width;
            apiPost('/api/v1/ui-style/menu/save', { values: { width: width } }).then(function (saved) {
                menuForm.option('formData', $.extend({}, saved));
                applyMenuWidth(saved.width);
                DevExpress.ui.notify('已保存', 'success', 2000);
            }, apiError);
        }
    });
    $('<div>').appendTo('#menuConfigActions').dxButton({
        text: '恢复默认', icon: 'revert',
        onClick: function () {
            DevExpress.ui.dialog.confirm('确定恢复默认菜单宽度吗？', '恢复默认').then(function (ok) {
                if (!ok) { return; }
                apiPost('/api/v1/ui-style/menu/reset').then(function (defaults) {
                    menuForm.option('formData', $.extend({}, defaults));
                    applyMenuWidth(defaults.width);
                    DevExpress.ui.notify('已恢复默认宽度', 'success', 2000);
                }, apiError);
            });
        }
    });

    activate(activeTab);
});
</script>
{% endblock %}
